name: Regenerar página
on:
  push:
    branches: [master]
    paths: ['data/catalog.json', 'tools/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install Pillow
      - run: python3 tools/validate_catalog.py
      - run: python3 tools/build_viewer.py
      - name: Commit index.html
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Regenerar index.html desde el catálogo" && git push)
