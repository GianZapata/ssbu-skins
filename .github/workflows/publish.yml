name: Sincronizar Firestore
# La web se publica en Vercel (build: npm run build → dist). Esta Action ya NO publica nada: solo valida el catálogo y lo copia a Firestore.
on:
  push:
    branches: [master]
    paths: ['data/catalog.json', 'data/ids.lock.json', 'data/drive.json', 'tools/catalog_data.py', 'tools/db.py', 'assets/fighters/**', 'assets/costumes/**', 'data/original_costumes.json', '.github/workflows/publish.yml']
  workflow_dispatch:
    inputs:
      sync_inventory:
        description: 'Sincronizar también el inventario con Firestore (revísalo antes; nunca es automático)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: firestore-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install Pillow
      - run: python3 tools/validate_catalog.py
      - name: Sincronizar el catálogo con Firestore (solo el catálogo)
        if: env.FIREBASE_SA != ''
        run: |
          pip install google-cloud-firestore
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" python3 tools/db.py seed --only catalog
      - name: Sincronizar el manifiesto del Drive con Firestore
        if: env.FIREBASE_SA != ''
        run: GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" python3 tools/db.py seed --only drive
      - name: Sincronizar el inventario con Firestore (manual)
        if: env.FIREBASE_SA != '' && github.event_name == 'workflow_dispatch' && inputs.sync_inventory
        run: GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" python3 tools/db.py seed --only installed
      - name: Sin secreto
        if: env.FIREBASE_SA == ''
        run: echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT, el catálogo no se sincronizó con Firestore."
