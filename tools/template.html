<style>

.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:none}
.sheet.open{display:block}

.dl div{margin:6px 0;font-size:14px}.dl .q{font-style:italic;color:var(--mu)}

.item .th img{width:100%;height:100%;object-fit:cover;display:block}
.item .m{flex:1;min-width:0}.item .m b{display:block;overflow-wrap:anywhere;cursor:pointer}.item .m span{color:var(--mu);font-size:13px}
.item .x{width:46px;padding:0;flex:none}
.grp{margin:16px 0 4px}.grp h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.send{position:sticky;bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 10px);margin-top:14px;z-index:5}
.send button{width:100%;min-height:54px;font-size:16px;box-shadow:0 6px 20px #000a}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin:0 0 12px;font-size:14px}
.box h3{margin:0 0 6px;font-size:16px}.box p{margin:6px 0;color:#c8ccd8}
.box input[type=text],.box input[type=password]{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);padding:0 12px;margin:6px 0}
.flow{display:flex;flex-direction:column;gap:8px}.flow div{display:flex;gap:10px}.flow b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#1a1300;display:grid;place-items:center;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 76px);background:#000e;color:#fff;padding:10px 16px;border-radius:20px;z-index:80;font-size:14px;max-width:90vw;display:none;text-align:center;pointer-events:none}
body.lock .toast{bottom:calc(env(safe-area-inset-bottom) + 150px)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:70;background:#000;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;color:#fff}
.lb-top .tt{flex:1;min-width:0}.lb-top .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lb-top .tt span{color:#bbb;font-size:13px}
.lb-top button{width:46px;padding:0;background:#222;border-color:#444;color:#fff;flex:none}
.lb-main{position:relative;flex:1;min-height:0}
.lb-track{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.lb-track::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.sl img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.sl.ld::after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #fff3;border-top-color:#fff;animation:sp .8s linear infinite}

.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;padding:0;background:#000a;border-color:#fff3;color:#fff;font-size:28px;z-index:2}

@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sheet .in{top:50%;bottom:auto;transform:translateY(-50%);border-radius:20px;max-width:600px;max-height:86vh;max-height:86dvh}}

</style></head><body>
<div class="fm" id="fm" hidden></div>

<div class="wrap">
<section id="vE">

</div>

 <button id="tE" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Explorar</button>

<script>
let F=/*DATA*/null;const META=/*META*/null;
const PAGE=40;
const WS={autor_explicito:['g','Declarado por el autor'],autor_condicionado:['','Con condiciones'],tercero:['','Según terceros'],sin_evidencia:['n','Sin evidencia'],incompatible:['r','Incompatible']};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const J=(k,d)=>{try{return JSON.parse(LS(k)||'null')??d}catch(e){return d}};
const key=(f,p)=>f.code+':'+p.id;
const BM='<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const gU=(f,s)=>s==='o'?META.base+'/'+f:META.base+'/'+(s==='m'?'530':'220')+'-90_'+f;
/* Rol: dueño (inició sesión con Google y la base lo reconoce) o visitante (ve la selección del dueño y recomienda) */
const OWNER=LS('ssbu_owner')==='1',FM=!OWNER;
let help={by:LS('ssbu_ownername')||'el dueño',raw:[]};   // visitante: selección del dueño, en vivo
const SELKEY=FM?'ssbu_fsel':'ssbu_sel_v2';
let sel=J(SELKEY,{});
let liveFriends={},liveIds={},pubT=0;                      // dueño: recomendaciones de visitantes, en vivo
let keepOrig=LS('ssbu_keep')==='1';
let repl=J('ssbu_repl',{});const saveRepl=()=>LS('ssbu_repl',JSON.stringify(repl));
let INST=(META.installed&&META.installed.fighters)||{};
let INFO=(META.installed&&META.installed.info)||{};
const IMGDIR='installed/';
const instInfo=(code,s)=>(INFO[code]||{})[s]||{};
let remote={items:{}},view='E',shown=PAGE,cur=[],detail=null;
let q='',fighter=LS('ssbu_fighter')||'',au='all',fwifi=false,fsel=false,fsug=false;
const all=[],idx={};
function buildData(){all.length=0;Object.keys(idx).forEach(k=>delete idx[k]);
 F.forEach((f,i)=>f.picks.forEach(p=>{const k=key(f,p);idx[k]={f,p,i,k};if(!p.withdrawn)all.push({f,p,i,k})}));
 all.sort((a,b)=>(b.p.audited-a.p.audited)||(a.i-b.i));
 if(fighter&&!F.some(f=>f.code===fighter))fighter=''}
buildData();
const touch=()=>{LS(SELKEY+'_at',Date.now());publish()};
const saveSel=()=>{LS(SELKEY,JSON.stringify(sel));touch()};
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)};
const rs=k=>remote.items[k]&&remote.items[k].status&&remote.items[k].status!=='wanted'?remote.items[k].status:null;
const nfil=()=>(au!=='all')+fwifi+fsel+fsug;

/* ---------- Cupos por luchador (en vivo) ---------- */
const usable=()=>keepOrig?[1,2,3,4,5,6,7]:[0,1,2,3,4,5,6,7];
const limit=()=>usable().length;
const isMii=p=>/mii/i.test(p.assignment||'');
const instSlots=code=>INST[code]||[];
const isRepl=(code,s)=>(repl[code]||[]).includes(s);
// slots instalados que siguen ocupando cupo (dentro de los usables y no marcados como reemplazables)
const instKept=code=>instSlots(code).filter(s=>usable().includes(s)&&!isRepl(code,s));
const nSel=code=>Object.keys(sel).filter(k=>idx[k]&&idx[k].f.code===code&&!isMii(idx[k].p)).length;
const used=code=>nSel(code)+instKept(code).length;
const slotNum=d=>{const m=/^c(\d\d)$/.exec(d||'');return m?+m[1]:null};
const slotName=n=>n==null?'sin slot':'c0'+n;
// slot asignado a cada skin elegida (no Mii) de un luchador: {slot: clave}
function bySlot(code){const m={};Object.keys(sel).forEach(k=>{if(idx[k]&&idx[k].f.code===code&&!isMii(idx[k].p)&&sel[k].slot!=null)m[sel[k].slot]=k});return m}
const takenSet=(code,except)=>{const t=new Set(instKept(code));Object.entries(bySlot(code)).forEach(([sl,k])=>{if(k!==except)t.add(+sl)});return t};
const firstFree=(code,except)=>{const t=takenSet(code,except),f=usable().find(x=>!t.has(x));return f===undefined?null:f};
// da un slot válido y único a cada skin elegida: respeta lo instalado, c00 reservado y el orden en que se eligieron
function ensureSlots(){if(FM)return false;let ch=false;const by={};
 Object.keys(sel).forEach(k=>{if(idx[k])(by[idx[k].f.code]=by[idx[k].f.code]||[]).push(k)});
 Object.entries(by).forEach(([code,ks])=>{ks.sort((a,b)=>(sel[a].t||0)-(sel[b].t||0));
  const inst=new Set(instKept(code)),seen=new Set();
  ks.forEach(k=>{if(isMii(idx[k].p)){if(sel[k].slot!=null){sel[k].slot=null;ch=true}return}
   let sl=sel[k].slot;const ok=sl!=null&&usable().includes(sl)&&!inst.has(sl)&&!seen.has(sl);
   if(!ok){sl=usable().find(x=>!inst.has(x)&&!seen.has(x));if(sl===undefined)sl=null;if(sel[k].slot!==sl){sel[k].slot=sl;ch=true}}
   if(sl!=null)seen.add(sl)})});
 if(ch)saveSel();return ch}
// nota (no alarma) cuando el slot asignado no es uno de los originales del mod: el instalador lo reubica
function reslotNote(k){const p=idx[k].p,sl=sel[k]&&sel[k].slot;if(sl==null)return '';
 const nat=(String(p.slots_orig||'').match(/\d+/g)||[]).map(Number);if(!nat.length||nat.includes(sl))return '';
 return `Se reubica de ${nat.length>2?'sus slots':slotName(nat[0])} a ${slotName(sl)}`}
const isFull=e=>!FM&&!isMii(e.p)&&used(e.f.code)>=limit();
const sugBy=k=>Object.entries(liveFriends).filter(([n,ks])=>ks.includes(k)).map(([n])=>n);
const sgText=k=>{if(FM)return help.raw.includes(k)?help.by+' ya la tiene':'';if(sel[k])return '';const n=sugBy(k);return n.length?'Sugerida · '+(n.length>2?n[0]+' +'+(n.length-1):n.join(', ')):''};
const isSug=k=>!!sgText(k);
const sugAll=()=>{const m={};Object.entries(liveFriends).forEach(([n,ks])=>ks.forEach(k=>{if(idx[k]&&!sel[k])(m[k]=m[k]||[]).push(n)}));return Object.keys(m).sort((a,b)=>m[b].length-m[a].length||idx[a].i-idx[b].i)};
const barCls=(u,L)=>u>=L?'full':u>=L-2?'warn':'';
function tileHTML(code,sn){const ins=instSlots(code).includes(sn),r=ins&&isRepl(code,sn),res=sn===0&&keepOrig,k=bySlot(code)[sn],inf=instInfo(code,sn);
 let cls='',img='',lab='libre',lbl='libre';
 if(res){cls='res';lab='orig.';lbl='reservado: diseño original'}
 else if(k){cls='sel';const p=idx[k].p;img=p.g&&p.g[0]?gU(p.g[0],'s'):p.img;lab=r?'cambia':'nueva';lbl='elegida: '+p.name}
 else if(ins&&!r){cls='ins';img=inf.i?IMGDIR+inf.i:'';lab=inf.n?inf.n:(inf.skin?'inst.':'en uso');lbl='ocupado en el ModPack'+(inf.n?': '+inf.n:'')}
 else if(ins&&r){cls='rep';img=inf.i?IMGDIR+inf.i:'';lab='se quita';lbl='se quitará lo instalado'}
 return `<button class="slt ${cls}${img?'':' ni'}" data-slot="${sn}" data-code="${esc(code)}" aria-label="c0${sn}, ${esc(lbl)}">${img?`<img alt="" loading="lazy" src="${esc(img)}">`:''}<b>c0${sn}</b><small>${esc(lab)}</small></button>`}
const tilesHTML=code=>`<div class="chips">${[0,1,2,3,4,5,6,7].map(sn=>tileHTML(code,sn)).join('')}</div>`;
function meterHTML(f){const u=used(f.code),L=limit(),ik=instKept(f.code).length,ns=nSel(f.code);
 return `<b>${esc(f.name)}: ${u}/${L} cupos</b><small>${ik?ik+' instalado'+(ik>1?'s':'')+' + '+ns+' elegida'+(ns==1?'':'s')+' · ':''}${u>L?'Te pasaste del máximo: quita '+(u-L):u===L?'Completo: quita una para añadir otra':'Quedan '+(L-u)+' ('+(keepOrig?'c01–c07':'c00–c07')+')'}</small><div class="bar ${barCls(u,L)}"><i style="width:${Math.min(100,u/L*100)}%"></i></div>`}
function paintMeter(){const m=$('meter');const f=F.find(x=>x.code===fighter);
 if(FM){m.hidden=true;return}
 if(!f){m.hidden=true;return}
 m.hidden=false;m.innerHTML=`<div class="mi">${meterHTML(f)}</div><button id="keep" aria-pressed="${keepOrig}">${keepOrig?'Conservo c00':'Uso c00'}</button>${tilesHTML(f.code)}`;
 $('keep').onclick=toggleKeep}
$('meter').onclick=e=>{const b=e.target.closest('[data-slot]');if(b)openSlot(b.dataset.code,+b.dataset.slot)};
function toggleKeep(){keepOrig=!keepOrig;LS('ssbu_keep',keepOrig?'1':'0');touch();paintAll();toast(keepOrig?'Máximo 7 por luchador: conservas el original (c00)':'Máximo 8 por luchador: usas c00–c07');if(view!=='E')renderView();if(lb.k)lbSync();if(detail)dSync()}

/* ---------- Tarjetas ---------- */
function stat(p,k){const r=rs(k);
 if(r)return `<span class="st ${r==='installed'?'g':'r'}"><i></i>${esc(r==='installed'?'Instalada':r)}</span>`;
 if(!p.audited)return '<span class="st"><i></i>Por auditar</span>';
 const x=WS[p.wifi_status]||['n',p.wifi_status||'Auditada'];return `<span class="st ${x[0]}"><i></i>${esc(x[1])}</span>`}
function matches(e){const {f,p,k}=e;
 if(fighter&&f.code!==fighter)return false;
 if(au==='aud'&&!p.audited)return false;if(au==='pend'&&p.audited)return false;
 if(fwifi&&!(p.wifi_status==='autor_explicito'||p.wifi_status==='autor_condicionado'))return false;
 if(fsel&&!sel[k])return false;
 if(fsug&&!isSug(k))return false;
 if(q){const s=(p.name+' '+f.name+' '+p.author).toLowerCase();if(!q.split(/\s+/).every(w=>s.includes(w)))return false}
 return true}
const SIZES='(min-width:1400px) 260px,(min-width:1000px) 250px,(min-width:700px) 240px,calc((100vw - 40px) / 2)';
function cardCls(e){return 'card'+(sel[e.k]?' saved':'')+(isSug(e.k)?' sg':'')+(isFull(e)?' full':'')}
function card(e,i){const {f,p,k}=e,on=!!sel[k];
 const img=p.img?`<img alt="" ${i<2?'':'loading="lazy" '}decoding="async" src="${esc(p.img)}"${p.srcset?` srcset="${esc(p.srcset)}" sizes="${SIZES}"`:''}>`:'';
 return `<div class="${cardCls(e)}" data-card="${esc(k)}"><button class="im" data-lb="${esc(k)}" aria-label="Ver fotos de ${esc(p.name)}">${img}<span class="sgb">${esc(sgText(k))}</span>${p.g&&p.g.length>1?`<span class="nph">${p.g.length} fotos</span>`:''}</button>
 <div class="cb"><div class="tx" data-d="${esc(k)}"><div class="nm">${esc(p.name)}</div><div class="fg">${esc(f.name)}</div></div>
 <div class="foot"><span class="stc">${stat(p,k)}</span><button class="bm ${on?'on':''}" data-b="${esc(k)}" aria-pressed="${on}" aria-label="${on?'Quitar de':'Guardar en'} mi selección: ${esc(p.name)}">${BM}</button></div></div></div>`}
function paintCard(el){const k=el.dataset.card,e=idx[k];if(!e)return;
 const c=cardCls(e);if(el.className!==c)el.className=c;
 const b=el.querySelector('.bm'),on=!!sel[k];
 if(b.classList.contains('on')!==on){b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',(on?'Quitar de':'Guardar en')+' mi selección: '+e.p.name)}
 const s=el.querySelector('.stc'),h=stat(e.p,k);if(s.innerHTML!==h)s.innerHTML=h;
 const sg=el.querySelector('.sgb'),t2=sgText(k);if(sg.textContent!==t2)sg.textContent=t2}
function paintAll(){ensureSlots();document.querySelectorAll('#grid .card').forEach(paintCard);paintMeter();counts()}

/* ---------- Explorar ---------- */
function fillFighters(){$('fs2').innerHTML='<option value="">Todos los luchadores</option>'+F.map(f=>`<option value="${esc(f.code)}"${f.code===fighter?' selected':''}>${esc(f.name)}</option>`).join('')}
function renderGrid(){cur=all.filter(matches);shown=PAGE;
 $('grid').innerHTML=cur.slice(0,shown).map((e,i)=>card(e,i)).join('');
 head();$('empty').hidden=!!cur.length;$('empty').textContent=F.length?'Nada con estos filtros.':(FBCFG?'Cargando catálogo…':'Catálogo no disponible');paintMeter();more()}
function head(){$('h2').innerHTML=`Explorar apariencias <span class="fg" style="font-size:14px;font-weight:400">· ${cur.length}</span>`;
 $('fbtn').className=nfil()?'on':'';$('fbtn').textContent='☰ Filtros'+(nfil()?' ('+nfil()+')':'')}
function more(){const r=cur.length-shown;$('more').hidden=r<=0;$('more').textContent='Ver más ('+r+')'}
function append(){if(shown>=cur.length)return;const s=shown;shown+=PAGE;
 $('grid').insertAdjacentHTML('beforeend',cur.slice(s,shown).map((e,i)=>card(e,s+i+2)).join(''));more()}
$('more').onclick=append;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&view==='E')append()},{rootMargin:'700px'}).observe($('sentinel'));
let qt;$('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{q=e.target.value.trim().toLowerCase();renderGrid()},160)};
$('q').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
$('fs2').onchange=e=>{fighter=e.target.value;LS('ssbu_fighter',fighter);renderGrid();e.target.blur()};
$('grid').onclick=e=>{const b=e.target.closest('[data-b]');if(b){toggle(b.dataset.b);return}
 const d=e.target.closest('[data-d]');if(d){openD(d.dataset.d);return}
 const l=e.target.closest('[data-lb]');if(l)openLB(l.dataset.lb,0)};
document.addEventListener('error',e=>{const t=e.target;if(!t||t.tagName!=='IMG')return;
 if(t.dataset.fb){t.classList.add('bad');return}t.dataset.fb='1';
 const s=t.currentSrc||t.src;t.removeAttribute('srcset');t.removeAttribute('sizes');
 if(s.includes('/530-90_'))t.src=s.replace('/530-90_','/220-90_');else t.classList.add('bad')},true);

/* ---------- Acciones ---------- */
function toggle(k){const e=idx[k];
 if(swap&&e.f.code===swap.code){doSwap(k);return true}
 if(FM&&!sel[k]&&!LS('ssbu_name')){needName(()=>toggle(k));return false}
 if(!sel[k]){if(isFull(e)){toast(`${e.f.name}: ya tienes ${used(e.f.code)}/${limit()}. Quita una para añadir otra`);buzz([30,40,30]);return false}
  sel[k]={t:Date.now(),slot:FM||isMii(e.p)?null:firstFree(e.f.code)}}else delete sel[k];
 saveSel();buzz(15);paintAll();if(detail===k)dSync();if(lb.k===k)lbSync();if(view!=='E')renderView();return true}
function counts(){const n=Object.keys(sel).length;$('bd').hidden=!n;$('bd').textContent=n;if(FM)paintFm()}
function paintFm(){const n=Object.keys(sel).filter(k=>idx[k]).length,b=$('fm');b.hidden=false;
 b.innerHTML=`<b>🤝 Recomendando ${help.by==='el dueño'?'al dueño':'a '+esc(help.by)} · ${n}</b><span class="live">${dbState==='ok'?'● En vivo':dbState==='err'?'● Sin conexión':dbState==='local'?'● Sin base de datos':'● …'}</span>`}

/* ---------- Pestañas ---------- */
const secs={E:'vE',S:'vS',P:'vP'},scrollPos={E:0,S:0,P:0};
function tab(v){if(v===view){scrollTo(0,0);return}scrollPos[view]=scrollY;view=v;
 Object.entries(secs).forEach(([x,id])=>{$(id).hidden=x!==v;$('t'+x).classList.toggle('on',x===v)});
 renderView();scrollTo(0,scrollPos[v]||0)}
function renderView(){if(view==='S')vSel();else if(view==='P')vInst()}
$('tE').onclick=()=>tab('E');$('tS').onclick=()=>tab('S');$('tP').onclick=()=>tab('P');
function vSel(){
 const ks=Object.keys(sel).filter(k=>idx[k]).sort((a,b)=>idx[a].i-idx[b].i||(sel[a].slot==null)-(sel[b].slot==null)||(sel[a].slot||0)-(sel[b].slot||0)),by={};
 ks.forEach(k=>(by[idx[k].f.code]=by[idx[k].f.code]||[]).push(k));
 const sk=FM?[]:sugAll();
 const sugLine=k=>{const n=sugBy(k);return `<br><span class="st g"><i></i>${esc(n.join(', '))}${n.length>1?' · '+n.length+' amigos':''}</span>`};
 const item=(k,s)=>{const {f,p}=idx[k];return `<div class="item"><button class="th" data-lb="${esc(k)}" aria-label="Ver fotos">${p.img?`<img alt="" loading="lazy" src="${esc(p.g&&p.g[0]?gU(p.g[0],'s'):p.img)}">`:''}</button><div class="m"><b data-d="${esc(k)}">${esc(p.name)}</b><span>${esc(f.name)}${s||FM?'':' · '+slotName(sel[k].slot)}</span><br><span class="stc">${stat(p,k)}</span>${s?sugLine(k):reslotNote(k)?`<br><span class="fg" style="font-size:12px">${esc(reslotNote(k))}</span>`:''}${s||FM||isMii(p)?'':`<div class="ia"><button class="sl2" data-sl="${esc(k)}" aria-label="Cambiar de slot">${slotName(sel[k].slot)} ▾</button><button data-mv="${esc(k)}" data-dir="-1" aria-label="Subir">▲</button><button data-mv="${esc(k)}" data-dir="1" aria-label="Bajar">▼</button><button data-sw="${esc(k)}">⇄ Cambiar</button></div>`}</div>
  ${s?`<button class="x p" data-add="${esc(k)}" aria-label="Añadir ${esc(p.name)}">＋</button>`:`<button class="x" data-b="${esc(k)}" aria-label="Quitar ${esc(p.name)}">✕</button>`}</div>`};
 const groups=Object.entries(by).map(([c,l])=>{const f=F.find(x=>x.code===c),u=used(c),L=limit();if(FM)return `<div class="grp"><h3><span>${esc(f.name)}</span><span style="color:var(--mu)">${l.length}</span></h3></div>`+l.map(k=>item(k)).join('');return `<div class="grp"><h3><span>${esc(f.name)}</span><span style="color:${u>L?'var(--er)':'var(--mu)'}">${instKept(c).length?instKept(c).length+' inst. · ':''}${u}/${L}</span></h3><div class="bar ${barCls(u,L)}"><i style="width:${Math.min(100,u/L*100)}%"></i></div><div style="display:flex;margin-top:8px">${tilesHTML(c)}</div></div>`+l.map(k=>item(k)).join('')}).join('');
 $('vS').innerHTML=`<header><div class="ttl"><div><h1>${FM?'Mis recomendaciones':'Mi selección'}</h1><p class="sub">${FM?ks.length+' para '+esc(help.by):ks.length+' guardada'+(ks.length==1?'':'s')+' · máx. '+limit()+' por luchador'}</p></div>${FM?'':'<button class="ib" id="shr" aria-label="Compartir la página con amigos">⇪</button>'}</div></header>
 ${sk.length?`<div class="box" style="margin-top:12px"><h3>Recomendadas por tus amigos (${sk.length})</h3><p>Las que más amigos eligieron van primero. Toca ＋ para añadir.</p>${sk.map(k=>item(k,1)).join('')}<div class="acts" style="padding:8px 0 0"><button id="addAll">Añadir todas</button></div></div>`:''}
 ${!FM&&Object.keys(liveFriends).length?`<div class="box"><h3>Amigos conectados</h3>${Object.entries(liveFriends).map(([n,ks])=>`<div class="opt" style="min-height:44px"><span style="flex:1">${esc(n)} · ${ks.length} recomendada${ks.length==1?'':'s'}</span><button data-fdel="${esc(n)}" style="min-height:36px">Quitar</button></div>`).join('')}</div>`:''}
 ${groups||'<p class="empty">Aún no guardaste nada.<br>Toca el marcador de una skin para añadirla.</p>'}
 <div class="syncst ${dbState}" id="syncst">${syncMsg()}</div>`;
 if($('shr'))$('shr').onclick=shareApp;
 if($('addAll'))$('addAll').onclick=()=>{let n=0,skp=0;sk.forEach(k=>{if(!sel[k]){if(isFull(idx[k]))skp++;else{sel[k]={t:Date.now()};n++}}});saveSel();paintAll();renderView();toast(n+' añadidas'+(skp?' · '+skp+' no caben en el máximo':''))};
 }
$('vS').onclick=e=>{const fd=e.target.closest('[data-fdel]');if(fd){dropFriend(fd.dataset.fdel);return}
 const t=e.target.closest('[data-slot]');if(t){openSlot(t.dataset.code,+t.dataset.slot);return}
 const sl=e.target.closest('[data-sl]');if(sl){openSlot(idx[sl.dataset.sl].f.code,sel[sl.dataset.sl].slot,'move');return}
 const mv=e.target.closest('[data-mv]');if(mv){moveSlot(mv.dataset.mv,+mv.dataset.dir);return}
 const sw=e.target.closest('[data-sw]');if(sw){const k=sw.dataset.sw;startSwap(idx[k].f.code,sel[k].slot,k);return}
 const b=e.target.closest('[data-b]');if(b){toggle(b.dataset.b);return}
 const a=e.target.closest('[data-add]');if(a){toggle(a.dataset.add);return}
 const d=e.target.closest('[data-d]');if(d){openD(d.dataset.d);return}
 const l=e.target.closest('[data-lb]');if(l)openLB(l.dataset.lb,0)};
/* ---------- Slots: hoja, mover y «quitar este por este» ---------- */
let slotCtx=null,swap=null;
const fname=code=>(F.find(f=>f.code===code)||{}).name||code;
const markRepl=(code,sn,on)=>{const a=repl[code]||[];repl[code]=on?(a.includes(sn)?a:[...a,sn]):a.filter(x=>x!==sn);if(!repl[code].length)delete repl[code];saveRepl()};
function afterSlotChange(){saveSel();paintAll();if(view!=='E')renderView();if(lb.k)lbSync();if(detail)dSync();if($('shL').classList.contains('open')&&slotCtx)openSlot(slotCtx.code,slotCtx.sn,slotCtx.mode,true)}
function openSlot(code,sn,mode,keep){if(sn==null||FM)return;slotCtx={code,sn,mode};
 const ins=instSlots(code).includes(sn),r=ins&&isRepl(code,sn),res=sn===0&&keepOrig,k=bySlot(code)[sn],inf=instInfo(code,sn);
 let body='',acts='';const act=(a,t,c)=>`<button data-act="${a}"${c?` class="${c}"`:''}>${t}</button>`;
 if(mode==='move'&&k){
  body=`<h3>${esc(idx[k].p.name)}</h3><p class="fg">Elige el slot de ${esc(fname(code))}. Si está ocupado por otra skin tuya, se intercambian; si es de lo instalado, se quitará.</p><div class="mvl">${usable().map(t=>{const kk=bySlot(code)[t],ii=instSlots(code).includes(t)&&!isRepl(code,t);
   const st=t===sn?'aquí':kk?'otra skin tuya: '+idx[kk].p.name:ii?'ocupado en el ModPack'+(instInfo(code,t).n?' · '+instInfo(code,t).n:''):'libre';
   return `<button data-to="${t}" ${t===sn?'disabled':''}><span><b>c0${t}</b> · ${esc(st)}</span><span>›</span></button>`}).join('')}</div>`;
  acts=act('back','Volver')}
 else if(res){body=`<h3>${esc(fname(code))} · c00</h3><p>Conservas el diseño original en c00.</p>`;acts=act('close','Cerrar')+act('usec00','Usar c00 también','p')}
 else if(k){const p=idx[k].p,n=reslotNote(k);
  body=`<h3>${esc(fname(code))} · ${slotName(sn)}</h3><div class="sp">${p.g&&p.g[0]?`<img alt="" src="${esc(gU(p.g[0],'m'))}">`:'<div class="nopic">sin foto</div>'}<div><b>${esc(p.name)}</b><div class="fg">por ${esc(p.author)}</div>${r?'<div class="fg">Reemplaza lo instalado en este slot</div>':''}${n?`<div class="fg">${esc(n)}</div>`:''}</div></div>`;

 if(!d){setDb('ok');if(Object.keys(sel).length)publish(true);return}
 const ms=d.updatedMs||0;
 if(ms>local){const np={};Object.entries(d.picks||{}).forEach(([k,v])=>{if(idx[k])np[k]={t:v.t||Date.now(),slot:v.slot==null?null:v.slot}});
  sel=np;repl=d.repl||{};keepOrig=!!d.keepOrig;
  LS(SELKEY,JSON.stringify(sel));LS('ssbu_repl',JSON.stringify(repl));LS('ssbu_keep',keepOrig?'1':'0');LS(SELKEY+'_at',ms);lastPub=pubSig();
  setDb('ok');ensureSlots();paintAll();renderView()}
 else if(ms<local)publish(true);else{lastPub=pubSig();setDb('ok')}}
function applySuggestions(snap){const m={},ids={};
 snap.forEach(d=>{const v=d.data()||{};let n=String(v.name||'Amigo').slice(0,40);if(m[n])n+=' ('+d.id.slice(0,3)+')';m[n]=(Array.isArray(v.picks)?v.picks:[]).filter(k=>idx[k]);ids[n]=d.id});
 if(sugInit)Object.entries(m).forEach(([n,ks])=>{const old=liveFriends[n];if(!old&&ks.length)toast(`${n} entró y recomendó ${ks.length}`);else if(old&&ks.length>old.length)toast(`${n} recomendó ${ks.length-old.length} más`)});
 liveFriends=m;liveIds=ids;sugInit=true;paintAll();if(view==='S')renderView()}
function applyStatus(snap){remote.items={};snap.forEach(d=>{const v=d.data()||{};remote.items[v.key||d.id]=v});paintAll();if(view==='S')renderView()}
async function dropFriend(name){if(!liveIds[name])return;try{const f=await fb();await f.deleteDoc(f.doc(f.db,'suggestions',liveIds[name]))}catch(e){dbErr(e)}}
// sesión del dueño
async function login(){try{const f=await fb();let u;
  const tu=EMU&&window.__fbTestUser;   // prueba con emuladores: cuenta de Google simulada
  if(tu)u=(await f.signInWithCredential(f.auth,f.GoogleAuthProvider.credential(JSON.stringify(tu)))).user;
  else u=(await f.signInWithPopup(f.auth,new f.GoogleAuthProvider())).user;
  const ref=f.doc(f.db,'config','owner'),s=await f.getDoc(ref);
  if(!s.exists())await f.setDoc(ref,{uid:u.uid,claimedAt:f.serverTimestamp()});   // el primero en entrar queda como dueño
  else if(s.data().uid!==u.uid){await f.signOut(f.auth);toast('Esta cuenta no es la del dueño');return}
  LS('ssbu_owner','1');if(!LS('ssbu_name')&&u.displayName)LS('ssbu_name',u.displayName.split(' ')[0]);location.reload()
 }catch(e){if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'))return;console.warn('login',e);toast('No se pudo entrar: '+((e&&e.code)||e))}}
async function logout(){if(!confirm('¿Cerrar sesión? Dejarás de editar la selección en este dispositivo.'))return;
 try{const f=await fb();await f.signOut(f.auth)}catch(e){}LS('ssbu_owner',null);location.reload()}
$('auth').textContent=OWNER?'👤':'🔒';$('auth').setAttribute('aria-label',OWNER?'Cerrar sesión':'Entrar como dueño');
$('auth').onclick=()=>OWNER?logout():login();
async function startDb(){if(!FBCFG)return;
 try{const f=await fb(),sub=(ref,ok)=>f.onSnapshot(ref,ok,e=>dbErr(e,true));
  sub(f.doc(f.db,'meta','catalog'),s=>{metaCat=s.exists()?s.data():null;maybeApplyCatalog()});
  sub(f.collection(f.db,'catalog'),s=>{catSnap=s;maybeApplyCatalog()});
  sub(f.doc(f.db,'meta','installed'),s=>{metaInst=s.exists()?s.data():null;maybeApplyInstalled()});
  sub(f.collection(f.db,'installed'),s=>{instSnap=s;maybeApplyInstalled()});
  sub(f.collection(f.db,'status'),applyStatus);
  sub(f.doc(f.db,'selection','main'),applySelection);
  if(!FM){
   sub(f.collection(f.db,'suggestions'),applySuggestions);
   if(!f.auth.currentUser){console.warn('sesión del dueño caducada');LS('ssbu_owner',null);location.reload();return}                                   // la sesión caducó
   sub(f.doc(f.db,'config','owner'),s=>{if(s.metadata.hasPendingWrites)return;   // estado provisional de una escritura que el servidor aún puede rechazar
    if(s.exists()&&f.auth.currentUser&&s.data().uid!==f.auth.currentUser.uid){console.warn('otra cuenta es la dueña');LS('ssbu_owner',null);location.reload()}})}
 }catch(e){dbErr(e,true)}}

if(FM){document.body.classList.add('fmode');$('tSl').textContent='Elegidas';$('tP').hidden=true}
ensureSlots();
fillFighters();renderGrid();counts();
startDb();
</script></body></html>
