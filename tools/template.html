<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Skins SSBU</title>
<style>
:root{--bg:#0d0f14;--s1:#151921;--s2:#1d222d;--bd:#2c3240;--tx:#f1f2f6;--mu:#98a0b3;--ac:#f2b632;--acd:#3a2d0c;--ok:#34c26b;--er:#e0574f;--r:16px;--bar:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 12px)}
button,select,input{font:inherit;color:inherit}
button{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:0 14px;min-height:46px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#1a1300;font-weight:700}
a{color:#8ab4ff}
.wrap{max-width:780px;margin:0 auto;padding:0 14px}
header{padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.ttl{display:flex;justify-content:space-between;align-items:flex-start}
h1{margin:0;font-size:32px;letter-spacing:-.5px;line-height:1.1}
.sub{color:var(--mu);margin:2px 0 0}
.ib{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;font-weight:700;background:none;border:2px solid #fff8}
.search{position:relative;margin:14px 0 10px}
.search input{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--bd);background:var(--s1);padding:0 14px 0 44px;font-size:16px}
.search svg{position:absolute;left:14px;top:14px;width:22px;height:22px;stroke:var(--mu)}
.row2{display:flex;gap:10px}
.row2 select{flex:1;min-width:0;min-height:50px;border-radius:14px;border:1px solid var(--bd);background:var(--s1);padding:0 12px;font-size:15px}
#fbtn{display:flex;align-items:center;gap:8px;min-width:130px;justify-content:center;border-radius:14px;min-height:50px}
#fbtn.on{border-color:var(--ac);color:var(--ac);background:var(--acd)}
h2{font-size:22px;margin:20px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card.saved{border-color:var(--ac)}
.card .im{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#000;border:0;padding:0;border-radius:0;min-height:0}
.card .im img{display:block;width:100%;height:100%;object-fit:cover}
.cb{padding:10px 10px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nm{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.fg{color:var(--mu);font-size:14px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:8px}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:4px 10px;font-size:12.5px;background:#2f2610;border:1px solid #5b4a1a;color:#f2d68a;min-width:0}
.st i{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
.st.g{background:#12301e;border-color:#245a39;color:#a6e6bf}.st.g i{background:var(--ok)}
.st.r{background:#33181a;border-color:#6a2a2d;color:#f0b4b0}.st.r i{background:var(--er)}
.st.n{background:var(--s2);border-color:var(--bd);color:var(--mu)}.st.n i{background:#6f778a}
.bm{flex:none;width:46px;height:46px;border-radius:10px;padding:0;background:none;border:2px solid #fffd;display:grid;place-items:center}
.bm svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.bm.on{border-color:var(--ac);background:var(--acd)}.bm.on svg{fill:var(--ac);stroke:var(--ac)}
.more{width:100%;margin:16px 0}
.empty{color:var(--mu);text-align:center;padding:32px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:780px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;border-radius:0;min-height:var(--bar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--mu);position:relative}
nav.tabs button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8}
nav.tabs button.on{color:var(--ac);font-weight:700}
nav.tabs button.on::after{content:"";position:absolute;bottom:6px;width:48px;height:3px;border-radius:2px;background:var(--ac)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:22px;height:22px;border-radius:11px;background:var(--ac);color:#1a1300;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:none}
.sheet.open{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-width:780px;margin:0 auto;max-height:90vh;background:var(--s1);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet .sc{overflow:auto;padding:14px 16px}
.sheet h3{margin:0 0 8px;font-size:18px}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--bd)}
.opt input{width:22px;height:22px;accent-color:var(--ac)}
.dh img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#000}
.dl div{margin:6px 0;font-size:14px}.dl .q{font-style:italic;color:var(--mu)}
.acts{display:flex;gap:10px;padding:10px 16px 14px}.acts button{flex:1}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.item img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#000;flex:none}
.item .m{flex:1;min-width:0}.item .m b{display:block}.item .m span{color:var(--mu);font-size:13px}
.item button{width:46px;padding:0}
.send{position:sticky;bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 10px);margin-top:14px}
.send button{width:100%;min-height:54px;font-size:16px;box-shadow:0 6px 20px #000a}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin:0 0 12px;font-size:14px}
.box h3{margin:0 0 6px;font-size:16px}.box p{margin:6px 0;color:#c8ccd8}
.box input{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);padding:0 12px;margin:6px 0}
.flow{display:flex;flex-direction:column;gap:8px}.flow div{display:flex;gap:10px}.flow b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#1a1300;display:grid;place-items:center;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 76px);background:#000e;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;font-size:14px;max-width:90vw;display:none}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.wrap,nav.tabs .in{max-width:1100px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div class="wrap" id="app"></div>
<nav class="tabs"><div class="in">
 <button id="tE" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Explorar</button>
 <button id="tS"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Mi selección<span class="badge" id="bd" hidden></span></button>
 <button id="tI"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Información</button>
</div></nav>
<div class="sheet" id="shF"><div class="in"><div class="sc">
 <h3>Filtros</h3>
 <label class="opt"><input type="radio" name="au" value="all"> Todas</label>
 <label class="opt"><input type="radio" name="au" value="aud"> Solo auditadas</label>
 <label class="opt"><input type="radio" name="au" value="pend"> Solo por auditar</label>
 <label class="opt"><input type="checkbox" id="fw"> Solo con Wi-Fi declarado por el autor</label>
 <label class="opt"><input type="checkbox" id="fs"> Solo guardadas en mi selección</label>
</div><div class="acts"><button id="fReset">Limpiar</button><button class="p" id="fOk">Aplicar</button></div></div></div>
<div class="sheet" id="shD"><div class="in"><div class="sc" id="dBody"></div><div class="acts"><button id="dClose">Cerrar</button><button class="p" id="dSave"></button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const F=/*DATA*/null;const META=/*META*/null;
const REPO='GianZapata/ssbu-skins',PATHF='selection.json',BR='master',PAGE=40;
const WS={autor_explicito:['g','Wi-Fi ok'],autor_condicionado:['','Wi-Fi condicionado'],tercero:['','Wi-Fi: terceros'],sin_evidencia:['n','Sin evidencia'],incompatible:['r','Incompatible']};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const key=(f,p)=>f.code+':'+p.id;
const BM='<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
let sel={};try{sel=JSON.parse(LS('ssbu_sel_v2')||'null')||{}}catch(e){}
try{const o=JSON.parse(LS('ssbu_sel_v1')||'null');if(o&&!Object.keys(sel).length){Object.keys(o).forEach(k=>sel[k]={t:Date.now()});LS('ssbu_sel_v2',JSON.stringify(sel))}}catch(e){}
let remote={items:{},sha:null},dirty=false,view='E',shown=PAGE,detail=null;
let q='',fighter=LS('ssbu_fighter')||'',au='all',fwifi=false,fsel=false;
const all=[];F.forEach((f,i)=>f.picks.forEach(p=>{if(!p.withdrawn)all.push({f,p,i,k:key(f,p)})}));
all.sort((a,b)=>(b.p.audited-a.p.audited)||(a.i-b.i));
const idx={};F.forEach((f,i)=>f.picks.forEach(p=>idx[key(f,p)]={f,p,i,k:key(f,p)}));
const saveSel=()=>LS('ssbu_sel_v2',JSON.stringify(sel));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)};
const rs=k=>remote.items[k]&&remote.items[k].status&&remote.items[k].status!=='wanted'?remote.items[k].status:null;
const nfil=()=>(au!=='all')+fwifi+fsel;

function stat(p,k){const r=rs(k);
 if(r)return `<span class="st ${r==='installed'?'g':'r'}"><i></i>${esc(r==='installed'?'Instalada':r)}</span>`;
 if(!p.audited)return '<span class="st"><i></i>Por auditar</span>';
 const x=WS[p.wifi_status]||['n',p.wifi_status||'Auditada'];return `<span class="st ${x[0]}"><i></i>${esc(x[1])}</span>`}
function matches(e){const {f,p,k}=e;
 if(fighter&&f.code!==fighter)return false;
 if(au==='aud'&&!p.audited)return false;if(au==='pend'&&p.audited)return false;
 if(fwifi&&!(p.wifi_status==='autor_explicito'||p.wifi_status==='autor_condicionado'))return false;
 if(fsel&&!sel[k])return false;
 if(q){const s=(p.name+' '+f.name+' '+p.author).toLowerCase();if(!q.split(/\s+/).every(w=>s.includes(w)))return false}
 return true}
function pic(p, kind, eager){
 if(!p.img) return '';
 const set=p.srcset?` srcset="${esc(p.srcset)}"`:'';
 const sizes=kind==='shot'?'(min-width: 780px) 748px, calc(100vw - 32px)':kind==='row'?'72px':'(min-width: 1000px) 260px, (min-width: 700px) 240px, calc((100vw - 40px) / 2)';
 const pri=eager==='high'?' fetchpriority="high"':'';
 return `<img alt="" loading="${eager?'eager':'lazy'}"${pri} decoding="async" src="${esc(p.img)}"${set} sizes="${sizes}">`;
}
function card(e,i){const {f,p,k}=e,on=!!sel[k];
 const eager=i===0?'high':i<2;
 return `<div class="card ${on?'saved':''}"><button class="im" data-d="${esc(k)}" aria-label="Ver ${esc(p.name)}">${pic(p,'card',eager)}</button>
 <div class="cb"><div class="nm">${esc(p.name)}</div><div class="fg">${esc(f.name)}</div>
 <div class="foot">${stat(p,k)}<button class="bm ${on?'on':''}" data-b="${esc(k)}" aria-pressed="${on}" aria-label="${on?'Quitar de':'Guardar en'} mi selección: ${esc(p.name)}">${BM}</button></div></div></div>`}

/* ---------- Vistas ---------- */
function vExplore(){
 const list=all.filter(matches);
 $('app').innerHTML=`<header><div class="ttl"><div><h1>Skins SSBU</h1><p class="sub">Tu catálogo personal</p></div><button class="ib" id="info" aria-label="Información">i</button></div>
 <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Buscar skin o luchador" value="${esc(q)}" autocomplete="off"></div>
 <div class="row2"><select id="fs2" aria-label="Luchador"><option value="">Todos los luchadores</option>${F.map(f=>`<option value="${esc(f.code)}" ${f.code===fighter?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
 <button id="fbtn" class="${nfil()?'on':''}">☰ Filtros${nfil()?' ('+nfil()+')':''}</button></div></header>
 <h2>Explorar apariencias <span class="fg" style="font-size:14px;font-weight:400">· ${list.length}</span></h2>
 <div class="grid" id="grid">${list.slice(0,shown).map((e,i)=>card(e,i)).join('')}</div>
 ${list.length>shown?`<button class="more" id="more">Ver más (${list.length-shown})</button>`:''}
 ${list.length?'':'<p class="empty">Nada con estos filtros.</p>'}`;
 $('q').oninput=e=>{q=e.target.value.trim().toLowerCase();shown=PAGE;const pos=e.target.selectionStart;vExplore();const i=$('q');i.focus();i.setSelectionRange(pos,pos)};
 $('fs2').onchange=e=>{fighter=e.target.value;LS('ssbu_fighter',fighter);shown=PAGE;vExplore()};
 $('fbtn').onclick=()=>{document.querySelector(`[name=au][value=${au}]`).checked=true;$('fw').checked=fwifi;$('fs').checked=fsel;$('shF').classList.add('open')};
 $('info').onclick=()=>tab('I');
 if($('more'))$('more').onclick=()=>{shown+=PAGE;vExplore()};
 bind()}
function bind(){
 document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>toggle(b.dataset.b));
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>openD(b.dataset.d))}
function vSel(){
 const ks=Object.keys(sel).filter(k=>idx[k]).sort((a,b)=>idx[a].i-idx[b].i);
 $('app').innerHTML=`<header><h1>Mi selección</h1><p class="sub">${ks.length} guardada${ks.length==1?'':'s'} para instalar</p></header>
 ${ks.map(k=>{const {f,p}=idx[k];return `<div class="item">${pic(p,'row')}<div class="m"><b>${esc(p.name)}</b><span>${esc(f.name)} · ${esc(p.dest||'sin destino')}</span><br>${stat(p,k)}</div><button data-d="${esc(k)}" aria-label="Detalles">›</button><button data-b="${esc(k)}" aria-label="Quitar ${esc(p.name)}">✕</button></div>`}).join('')||'<p class="empty">Aún no guardaste nada.<br>Toca el marcador de una skin para añadirla.</p>'}
 <div class="send" ${dirty||pending()?'':'hidden'}><button class="p" id="send">${tok()?'Enviar al ModPack ('+ks.length+')':'Conectar y enviar ('+ks.length+')'}</button></div>`;
 if($('send'))$('send').onclick=push;bind()}
function vInfo(){
 const a=all.filter(e=>e.p.audited).length,n=Object.keys(sel).length;
 const gen=((META&&META.generated)||'').replace('T',' ').replace(/Z$/,'');
 const tz=META&&META.timezone?' ('+META.timezone+')':'';
 $('app').innerHTML=`<header><h1>Información</h1><p class="sub">${a} auditadas de ${all.length} · catálogo ${esc(gen)}${esc(tz)}</p></header>
 <div class="box"><h3>Cómo funciona</h3><div class="flow">
 <div><b>1</b><span>Un bot (Grok) audita las skins y actualiza <code>data/catalog.json</code>.</span></div>
 <div><b>2</b><span>Otro agente regenera esta página con el catálogo.</span></div>
 <div><b>3</b><span>Tú guardas las que quieres: se escribe <code>selection.json</code>.</span></div>
 <div><b>4</b><span>Un agente instalador lee esa lista y las instala en la Switch.</span></div></div></div>
 <div class="box"><h3>Conexión con el ModPack</h3>
 <p>La selección se envía a <b>${REPO}</b>. Necesitas un token fine-grained con <i>Contents: read and write</i> solo en ese repo. Se guarda únicamente en este dispositivo.</p>
 <input type="password" id="tok" placeholder="${tok()?'Token guardado · pega otro para reemplazar':'github_pat_…'}" autocomplete="off">
 <div class="acts" style="padding:4px 0 0"><button class="p" id="tokS">Guardar</button><button id="tokD">Quitar</button></div></div>
 <div class="box"><h3>Respaldo</h3><p>${n} en tu selección.</p><div class="acts" style="padding:4px 0 0"><button id="copy">Copiar JSON</button><button id="clr">Vaciar selección</button></div></div>`;
 $('tokS').onclick=async()=>{const v=$('tok').value.trim();if(!v)return;LS('ssbu_tok',v);await pull();toast('Token guardado');vInfo()};
 $('tokD').onclick=()=>{LS('ssbu_tok',null);toast('Token quitado');vInfo()};
 $('copy').onclick=async()=>{const t=JSON.stringify(build(),null,2);try{await navigator.clipboard.writeText(t);toast('JSON copiado')}catch(e){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));l.download='selection.json';l.click()}};
 $('clr').onclick=()=>{if(confirm('¿Vaciar toda la selección?')){sel={};dirty=true;saveSel();counts();vInfo()}}}
function render(){({E:vExplore,S:vSel,I:vInfo})[view]();counts()}
function tab(v){view=v;['E','S','I'].forEach(x=>$('t'+x).classList.toggle('on',x===v));render();scrollTo(0,0)}
$('tE').onclick=()=>tab('E');$('tS').onclick=()=>tab('S');$('tI').onclick=()=>tab('I');
function counts(){const n=Object.keys(sel).length;$('bd').hidden=!n;$('bd').textContent=n}

/* ---------- Acciones ---------- */
function toggle(k){if(sel[k])delete sel[k];else sel[k]={t:Date.now()};dirty=true;saveSel();if(navigator.vibrate)navigator.vibrate(15);
 const y=scrollY;render();scrollTo(0,y);if(detail===k)dSync()}
$('fReset').onclick=()=>{au='all';fwifi=false;fsel=false;$('shF').classList.remove('open');shown=PAGE;render()};
$('fOk').onclick=()=>{au=document.querySelector('[name=au]:checked').value;fwifi=$('fw').checked;fsel=$('fs').checked;$('shF').classList.remove('open');shown=PAGE;render()};
document.querySelectorAll('.sheet').forEach(s=>s.onclick=e=>{if(e.target===s)s.classList.remove('open');if(s.id==='shD')detail=null});
function openD(k){detail=k;const {f,p}=idx[k];const d=[];
 if(p.audited){
  if(p.wifi_quote)d.push(`<div class="q">«${esc(p.wifi_quote)}» ${p.wifi_source_url?`<a href="${esc(p.wifi_source_url)}" target="_blank" rel="noopener">fuente</a>`:''}</div>`);
  if(p.conditions)d.push(`<div><b>Condiciones:</b> ${esc(p.conditions)}</div>`);
  if(p.design)d.push(`<div><b>Diseño:</b> ${esc(p.design)}</div>`);
  d.push(`<div><b>Slots:</b> orig. ${esc(p.slots_orig||'?')} → ${esc(p.dest||'?')} ${p.assignment?'('+esc(p.assignment)+')':''}</div>`);
  if(p.conflicts)d.push(`<div><b>Conflictos:</b> ${esc(p.conflicts)}</div>`);
  if(p.deps)d.push(`<div><b>Dependencias:</b> ${esc(p.deps)}</div>`);
  d.push(`<div><b>Compatibilidad:</b> ${esc(p.compat||'no verificada')} · ${esc(p.console_test||'prueba en consola pendiente')}</div>`);
  if(p.notes)d.push(`<div>${esc(p.notes)}</div>`);
 }else{d.push(`<div class="q">Pendiente de auditoría. Cita previa sin verificar: ${esc(p.quote_prev)}</div><div><b>Slots orig.:</b> ${esc(p.slots_orig)} · archivo sin inspeccionar</div>`)}
 $('dBody').innerHTML=`<div class="dh">${pic(p,'shot','high')}</div><h3 style="margin-top:12px">${esc(p.name)}</h3><div class="fg">${esc(f.name)} · por ${esc(p.author)} · <a href="${esc(p.url)}" target="_blank" rel="noopener">GameBanana</a> · #${p.id}</div><div style="margin:8px 0">${stat(p,k)}</div><div class="dl">${d.join('')}</div>`;
 dSync();$('shD').classList.add('open')}
function dSync(){$('dSave').textContent=sel[detail]?'Quitar de mi selección':'Guardar en mi selección'}
$('dClose').onclick=()=>{$('shD').classList.remove('open');detail=null};
$('dSave').onclick=()=>{toggle(detail)};

/* ---------- Contrato selection.json ---------- */
function build(){const items=[];
 Object.keys(sel).forEach(k=>{const e=idx[k];if(!e)return;const {f,p}=e,r=remote.items[k];
  items.push({key:k,fighter:f.name,roster_no:f.code,mod_id:p.id,name:p.name,author:p.author,url:p.url,dest_slot:p.dest||null,native_slots:p.slots_orig||null,assignment:p.assignment||null,audited:p.audited,wifi:p.wifi_status||'pendiente',dependencies:p.deps||null,conflicts:p.conflicts||null,notes:p.notes||null,
   status:(r&&r.status)||'wanted',selected_at:(r&&r.selected_at)||new Date(sel[k].t).toISOString(),...(r&&r.status&&r.status!=='wanted'?{result:r.result||null,updated_at:r.updated_at||null}:{})})});
 Object.keys(remote.items).forEach(k=>{const r=remote.items[k];if(!sel[k]&&r.status&&r.status!=='wanted')items.push(r)});
 return {schema:1,generated_at:new Date().toISOString(),catalog:META&&META.generated||null,target:{game:'Super Smash Bros. Ultimate',version:'13.0.5',loader:'ARCropolis 4.1.1',modpack_repo:'GianZapata/Gian-Ultimate-Modpack-private'},items}}
function pending(){const a=Object.keys(sel).sort().join(),b=Object.keys(remote.items).filter(k=>(remote.items[k].status||'wanted')==='wanted').sort().join();return a!==b}

/* ---------- GitHub ---------- */
const tok=()=>LS('ssbu_tok');
const gh=(u,o={})=>fetch('https://api.github.com/repos/'+REPO+u,{...o,headers:{Accept:'application/vnd.github+json',...(tok()?{Authorization:'Bearer '+tok()}:{}),...(o.headers||{})}});
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64e=s=>{let r='';new TextEncoder().encode(s).forEach(c=>r+=String.fromCharCode(c));return btoa(r)};
const applyRemote=j=>{remote.items={};(j.items||[]).forEach(e=>{remote.items[e.key]=e})};
async function pull(first){
 try{let r;
  if(tok()){r=await gh('/contents/'+PATHF+'?ref='+BR);if(r.status===404){remote={items:{},sha:null};return}if(!r.ok)throw 0;const j=await r.json();remote.sha=j.sha;applyRemote(JSON.parse(b64d(j.content)))}
  else{r=await fetch(PATHF+'?'+Date.now());if(!r.ok)return;applyRemote(await r.json())}
  if(first&&!Object.keys(sel).length&&!dirty){Object.values(remote.items).forEach(e=>{if(idx[e.key]&&(e.status||'wanted')==='wanted')sel[e.key]={t:Date.parse(e.selected_at)||Date.now()}});saveSel()}
 }catch(e){}
 render()}
async function push(){
 if(!tok()){tab('I');toast('Primero pega tu token');return}
 const b=$('send');b.disabled=true;b.textContent='Enviando…';
 try{await pull();
  const body={message:`Selección de skins: ${Object.keys(sel).length} guardadas`,content:b64e(JSON.stringify(build(),null,2)+'\n'),branch:BR};if(remote.sha)body.sha=remote.sha;
  const r=await gh('/contents/'+PATHF,{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status===401||r.status===403?'el token no tiene permiso de escritura':r.status===409||r.status===422?'conflicto, reintenta':'GitHub '+r.status);
  const j=await r.json();remote.sha=j.content.sha;dirty=false;await pull();toast('Enviado ✓ Ya queda para instalar')
 }catch(e){toast('Error: '+e.message);if($('send')){$('send').disabled=false}}}
addEventListener('beforeunload',e=>{if(dirty&&tok()){e.preventDefault();e.returnValue=''}});
render();pull(true);
</script></body></html>
