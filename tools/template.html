<script>
const F=/*DATA*/null;const META=/*META*/null;

const WS={autor_explicito:['g','Declarado por el autor'],autor_condicionado:['','Con condiciones'],tercero:['','Según terceros'],sin_evidencia:['n','Sin evidencia'],incompatible:['r','Incompatible']};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const J=(k,d)=>{try{return JSON.parse(LS(k)||'null')??d}catch(e){return d}};
const key=(f,p)=>f.code+':'+p.id;
const BM='<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const gU=(f,s)=>s==='o'?META.base+'/'+f:META.base+'/'+(s==='m'?'530':'220')+'-90_'+f;
/* Amigos: #help (yo → amigo) abre el modo ayuda; #sug (amigo → yo) trae sus recomendaciones; #sel es el formato antiguo de #sug */
function parseHash(){const h=location.hash.replace(/^#/,''),rm=h.match(/^room=([a-z0-9]{6,32})$/);if(rm)return {type:'room',id:rm[1],by:'',raw:[]};
 const m=h.match(/^(sel|help|sug)=([^&]*)(?:&by=(.*))?$/);if(!m)return null;
 let by='';try{by=m[3]?decodeURIComponent(m[3]):''}catch(e){}
 const raw=m[2].split(',').filter(Boolean).map(x=>{const i=x.indexOf('.');if(i<1)return null;try{return decodeURIComponent(x.slice(0,i))+':'+x.slice(i+1)}catch(e){return null}}).filter(Boolean);
 return {type:m[1]==='help'?'help':'sug',by,raw}}
const HASH=parseHash();

/* ---------- Cupos por luchador (en vivo) ---------- */
const usable=()=>keepOrig?[1,2,3,4,5,6,7]:[0,1,2,3,4,5,6,7];
const limit=()=>usable().length;
const isMii=p=>/mii/i.test(p.assignment||'');

const isRepl=(code,s)=>(repl[code]||[]).includes(s);
// slots instalados que siguen ocupando cupo (dentro de los usables y no marcados como reemplazables)
const instKept=code=>instSlots(code).filter(s=>usable().includes(s)&&!isRepl(code,s));
const nSel=code=>Object.keys(sel).filter(k=>idx[k]&&idx[k].f.code===code&&!isMii(idx[k].p)).length;
const used=code=>nSel(code)+instKept(code).length;
const slotNum=d=>{const m=/^c(\d\d)$/.exec(d||'');return m?+m[1]:null};
const slotName=n=>n==null?'sin slot':'c0'+n;
// slot asignado a cada skin elegida (no Mii) de un luchador: {slot: clave}
function bySlot(code){const m={};Object.keys(sel).forEach(k=>{if(idx[k]&&idx[k].f.code===code&&!isMii(idx[k].p)&&sel[k].slot!=null)m[sel[k].slot]=k});return m}
const takenSet=(code,except)=>{const t=new Set(instKept(code));Object.entries(bySlot(code)).forEach(([sl,k])=>{if(k!==except)t.add(+sl)});return t};
const firstFree=(code,except)=>{const t=takenSet(code,except),f=usable().find(x=>!t.has(x));return f===undefined?null:f};
// da un slot válido y único a cada skin elegida: respeta lo instalado, c00 reservado y el orden en que se eligieron
function ensureSlots(){if(FM)return false;let ch=false;const by={};
 Object.keys(sel).forEach(k=>{if(idx[k])(by[idx[k].f.code]=by[idx[k].f.code]||[]).push(k)});
 Object.entries(by).forEach(([code,ks])=>{ks.sort((a,b)=>(sel[a].t||0)-(sel[b].t||0));
  const inst=new Set(instKept(code)),seen=new Set();
  ks.forEach(k=>{if(isMii(idx[k].p)){if(sel[k].slot!=null){sel[k].slot=null;ch=true}return}
   let sl=sel[k].slot;const ok=sl!=null&&usable().includes(sl)&&!inst.has(sl)&&!seen.has(sl);
   if(!ok){sl=usable().find(x=>!inst.has(x)&&!seen.has(x));if(sl===undefined)sl=null;if(sel[k].slot!==sl){sel[k].slot=sl;ch=true}}
   if(sl!=null)seen.add(sl)})});
 if(ch)saveSel();return ch}
// nota (no alarma) cuando el slot asignado no es uno de los originales del mod: el instalador lo reubica
function reslotNote(k){const p=idx[k].p,sl=sel[k]&&sel[k].slot;if(sl==null)return '';
 const nat=(String(p.slots_orig||'').match(/\d+/g)||[]).map(Number);if(!nat.length||nat.includes(sl))return '';
 return `Se reubica de ${nat.length>2?'sus slots':slotName(nat[0])} a ${slotName(sl)}`}
const isFull=e=>!FM&&!isMii(e.p)&&used(e.f.code)>=limit();
const allFriends=()=>({...sugg.friends,...liveFriends});
const sugBy=k=>Object.entries(allFriends()).filter(([n,ks])=>ks.includes(k)).map(([n])=>n);
const sgText=k=>{if(FM)return help.raw.includes(k)?help.by+' ya la tiene':'';if(sel[k])return '';const n=sugBy(k);return n.length?'Sugerida · '+(n.length>2?n[0]+' +'+(n.length-1):n.join(', ')):''};
const isSug=k=>!!sgText(k);
const sugAll=()=>{const m={};Object.entries(allFriends()).forEach(([n,ks])=>ks.forEach(k=>{if(idx[k]&&!sel[k])(m[k]=m[k]||[]).push(n)}));return Object.keys(m).sort((a,b)=>m[b].length-m[a].length||idx[a].i-idx[b].i)};
const barCls=(u,L)=>u>=L?'full':u>=L-2?'warn':'';
function tileHTML(code,sn){const ins=instSlots(code).includes(sn),r=ins&&isRepl(code,sn),res=sn===0&&keepOrig,k=bySlot(code)[sn],inf=instInfo(code,sn);
 let cls='',img='',lab='libre',lbl='libre';
 if(res){cls='res';lab='orig.';lbl='reservado: diseño original'}
 else if(k){cls='sel';const p=idx[k].p;img=p.g&&p.g[0]?gU(p.g[0],'s'):p.img;lab=r?'cambia':'nueva';lbl='elegida: '+p.name}
 else if(ins&&!r){cls='ins';img=inf.i?IMGDIR+inf.i:'';lab=inf.n?inf.n:(inf.skin?'inst.':'en uso');lbl='ocupado en el ModPack'+(inf.n?': '+inf.n:'')}
 else if(ins&&r){cls='rep';img=inf.i?IMGDIR+inf.i:'';lab='se quita';lbl='se quitará lo instalado'}
 return `<button class="slt ${cls}${img?'':' ni'}" data-slot="${sn}" data-code="${esc(code)}" aria-label="c0${sn}, ${esc(lbl)}">${img?`<img alt="" loading="lazy" src="${esc(img)}">`:''}<b>c0${sn}</b><small>${esc(lab)}</small></button>`}
const tilesHTML=code=>`<div class="chips">${[0,1,2,3,4,5,6,7].map(sn=>tileHTML(code,sn)).join('')}</div>`;
function meterHTML(f){const u=used(f.code),L=limit(),ik=instKept(f.code).length,ns=nSel(f.code);
 return `<b>${esc(f.name)}: ${u}/${L} cupos</b><small>${ik?ik+' instalado'+(ik>1?'s':'')+' + '+ns+' elegida'+(ns==1?'':'s')+' · ':''}${u>L?'Te pasaste del máximo: quita '+(u-L):u===L?'Completo: quita una para añadir otra':'Quedan '+(L-u)+' ('+(keepOrig?'c01–c07':'c00–c07')+')'}</small><div class="bar ${barCls(u,L)}"><i style="width:${Math.min(100,u/L*100)}%"></i></div>`}
function paintMeter(){const m=$('meter');const f=F.find(x=>x.code===fighter);
 if(FM){m.hidden=true;return}

/* ---------- Slots: hoja, mover y «quitar este por este» ---------- */
let slotCtx=null,swap=null;
const fname=code=>(F.find(f=>f.code===code)||{}).name||code;
const markRepl=(code,sn,on)=>{const a=repl[code]||[];repl[code]=on?(a.includes(sn)?a:[...a,sn]):a.filter(x=>x!==sn);if(!repl[code].length)delete repl[code];saveRepl()};
function afterSlotChange(){dirty=true;saveSel();paintAll();if(view!=='E')renderView();if(lb.k)lbSync();if(detail)dSync();if($('shL').classList.contains('open')&&slotCtx)openSlot(slotCtx.code,slotCtx.sn,slotCtx.mode,true)}
function openSlot(code,sn,mode,keep){if(sn==null||FM)return;slotCtx={code,sn,mode};
 const ins=instSlots(code).includes(sn),r=ins&&isRepl(code,sn),res=sn===0&&keepOrig,k=bySlot(code)[sn],inf=instInfo(code,sn);
 let body='',acts='';const act=(a,t,c)=>`<button data-act="${a}"${c?` class="${c}"`:''}>${t}</button>`;
 if(mode==='move'&&k){
  body=`<h3>${esc(idx[k].p.name)}</h3><p class="fg">Elige el slot de ${esc(fname(code))}. Si está ocupado por otra skin tuya, se intercambian; si es de lo instalado, se quitará.</p><div class="mvl">${usable().map(t=>{const kk=bySlot(code)[t],ii=instSlots(code).includes(t)&&!isRepl(code,t);
   const st=t===sn?'aquí':kk?'otra skin tuya: '+idx[kk].p.name:ii?'ocupado en el ModPack'+(instInfo(code,t).n?' · '+instInfo(code,t).n:''):'libre';
   return `<button data-to="${t}" ${t===sn?'disabled':''}><span><b>c0${t}</b> · ${esc(st)}</span><span>›</span></button>`}).join('')}</div>`;
  acts=act('back','Volver')}
 else if(res){body=`<h3>${esc(fname(code))} · c00</h3><p>Conservas el diseño original en c00.</p>`;acts=act('close','Cerrar')+act('usec00','Usar c00 también','p')}
 else if(k){const p=idx[k].p,n=reslotNote(k);
  body=`<h3>${esc(fname(code))} · ${slotName(sn)}</h3><div class="sp">${p.g&&p.g[0]?`<img alt="" src="${esc(gU(p.g[0],'m'))}">`:'<div class="nopic">sin foto</div>'}<div><b>${esc(p.name)}</b><div class="fg">por ${esc(p.author)}</div>${r?'<div class="fg">Reemplaza lo instalado en este slot</div>':''}${n?`<div class="fg">${esc(n)}</div>`:''}</div></div>`;
  acts=act('swap','⇄ Cambiar por otra…','p')+act('move','Mover de slot')+act('rm','Quitar de mi selección')}
 else if(ins&&!r){const nm=inf.n||(inf.skin?'Skin instalada (sin nombre)':'Slot en uso');
  body=`<h3>${esc(fname(code))} · ${slotName(sn)}</h3><div class="sp">${inf.i?`<img alt="" src="${esc(IMGDIR+inf.i)}">`:'<div class="nopic">sin retrato</div>'}<div><b>${esc(nm)}</b><div class="fg">${inf.skin?'Skin completa con retrato propio en el ModPack.':'Ocupado en el ModPack, sin retrato propio: puede ser solo un ajuste de modelo.'}</div></div></div>`;
  acts=act('swap','⇄ Reemplazar por una skin…','p')+act('free','Quitar sin reemplazar')}
 else if(ins&&r){
  body=`<h3>${esc(fname(code))} · ${slotName(sn)}</h3><div class="sp">${inf.i?`<img alt="" style="opacity:.5" src="${esc(IMGDIR+inf.i)}">`:'<div class="nopic">sin retrato</div>'}<div><b>${esc(inf.n||'Lo instalado aquí')}</b><div class="fg">Se quitará y el slot queda libre para una skin nueva.</div></div></div>`;
  acts=act('swap','Elegir skin para este slot…','p')+act('keepinst','Conservar lo instalado')}
 else{body=`<h3>${esc(fname(code))} · ${slotName(sn)}</h3><p>Slot libre.</p>`;acts=act('swap','Elegir skin para este slot…','p')+act('close','Cerrar')}
 $('lBody').innerHTML=body;$('lActs').innerHTML=acts;$('lActs').style.flexWrap='wrap';
 if(!keep)openOv('shL')}
$('shL').onclick=e=>{if(e.target===$('shL'))closeOv('shL')};
$('lBody').onclick=e=>{const t=e.target.closest('[data-to]');if(t&&slotCtx){moveTo(bySlot(slotCtx.code)[slotCtx.sn],+t.dataset.to)}};
$('lActs').onclick=e=>{const b=e.target.closest('[data-act]');if(!b||!slotCtx)return;const {code,sn}=slotCtx,k=bySlot(code)[sn];
 switch(b.dataset.act){
  case 'close':closeOv('shL');break;
  case 'back':openSlot(code,sn,'',true);break;
  case 'move':openSlot(code,sn,'move',true);break;
  case 'usec00':closeOv('shL');toggleKeep();break;
  case 'free':markRepl(code,sn,true);toast(slotName(sn)+': se quitará lo instalado');afterSlotChange();break;
  case 'keepinst':markRepl(code,sn,false);ensureSlots();afterSlotChange();break;
  case 'rm':closeOv('shL');if(k)toggle(k);break;
  case 'swap':closeOv('shL');startSwap(code,sn,k||null);break}};
function moveTo(k,t){if(!k||!sel[k])return;const code=idx[k].f.code,cur=sel[k].slot;if(t===cur)return;
 const occ=bySlot(code)[t];
 if(occ&&occ!==k)sel[occ].slot=cur;
 else if(instKept(code).includes(t)){markRepl(code,t,true);toast(slotName(t)+': se quitará lo instalado')}
 sel[k].slot=t;slotCtx.sn=t;slotCtx.mode='';afterSlotChange()}
function moveSlot(k,dir){if(!sel[k]||sel[k].slot==null)return;const code=idx[k].f.code,u=usable();let i=u.indexOf(sel[k].slot);
 for(i+=dir;i>=0&&i<u.length;i+=dir){const t=u[i];if(instKept(code).includes(t))continue;const occ=bySlot(code)[t];if(occ&&occ!==k)sel[occ].slot=sel[k].slot;sel[k].slot=t;dirty=true;saveSel();paintAll();if(view!=='E')renderView();return}
 toast('No hay más slots en esa dirección')}
function startSwap(code,sn,from){swap={code,slot:sn,from};fighter=code;LS('ssbu_fighter',fighter);fillFighters();if(view!=='E')tab('E');renderGrid();paintSw();scrollTo(0,0)}
function paintSw(){const b=$('sw');$('fs2').disabled=!!swap;if(!swap){b.hidden=true;return}
 b.hidden=false;b.innerHTML=`<b>${swap.from?'Cambiar «'+esc(idx[swap.from].p.name)+'» por…':'Elige la skin para '+slotName(swap.slot)} · ${esc(fname(swap.code))}</b><button id="swX">Cancelar</button>`;$('swX').onclick=endSwap}
function endSwap(){swap=null;paintSw();renderGrid()}
function doSwap(k){const {code,slot,from}=swap,e=idx[k];
 if(isMii(e.p)){toast('Los trajes Mii no usan slot c00–c07');return}
 let msg=`«${e.p.name}» va en ${slotName(slot)}`;
 if(from&&from!==k&&sel[from]){msg=`«${e.p.name}» reemplaza a «${idx[from].p.name}» en ${slotName(slot)}`;delete sel[from]}
 const occ=bySlot(code)[slot];if(occ&&occ!==k&&sel[occ])sel[occ].slot=sel[k]&&sel[k].slot!=null?sel[k].slot:null;
 if(instSlots(code).includes(slot)&&!isRepl(code,slot)){markRepl(code,slot,true);msg+=' (se quita lo instalado)'}
 if(!sel[k])sel[k]={t:Date.now()};sel[k].slot=slot;
 swap=null;paintSw();dirty=true;saveSel();buzz(15);paintAll();renderGrid();if(view!=='E')renderView();toast(msg)}

function vInst(){
 let nf=0,ns=0,ni=0,nn=0;Object.entries(INST).forEach(([c,v])=>{nf++;ns+=v.length;v.forEach(sn=>{const i=instInfo(c,sn);if(i.skin)ni++;if(i.n)nn++})});
 const rows=F.filter(f=>{const u=used(f.code),L=limit(),ch=nSel(f.code)||(repl[f.code]||[]).length;return pfl==='free'?u<L:pfl==='full'?u>=L:pfl==='chg'?!!ch:pfl==='inst'?instSlots(f.code).length>0:true});

 ${rows.map(f=>{const u=used(f.code),L=limit();return `<div class="prow"><button class="pn" data-pf="${esc(f.code)}"><span style="color:var(--tx);font-weight:700;font-size:15px">${esc(f.name)}</span><span>${u}/${L} ›</span></button>${tilesHTML(f.code)}</div>`}).join('')||'<p class="empty">Ninguno con este filtro.</p>'}`}
$('vP').onclick=e=>{const t=e.target.closest('[data-slot]');if(t){openSlot(t.dataset.code,+t.dataset.slot);return}
 const f=e.target.closest('[data-pfl]');if(f){pfl=f.dataset.pfl;LS('ssbu_pfl',pfl);vInst();return}

/* ---------- Capas (sheets y lightbox) con botón Atrás ---------- */
const ovs=[];let skip=0;
function openOv(id){if(ovs.includes(id))return;$(id).classList.add('open');ovs.push(id);document.body.classList.add('lock');try{history.pushState({ov:id},'')}catch(e){}}
function hideOv(id){const i=ovs.lastIndexOf(id);if(i<0)return false;ovs.splice(i,1);$(id).classList.remove('open');if(!ovs.length)document.body.classList.remove('lock');return true}
function closeOv(id){if(!hideOv(id))return;if(history.state&&history.state.ov){skip++;history.back()}}
function swapOv(from,to){hideOv(from);$(to).classList.add('open');ovs.push(to);document.body.classList.add('lock');try{history.replaceState({ov:to},'')}catch(e){}}
addEventListener('popstate',()=>{if(skip){skip--;return}const id=ovs[ovs.length-1];if(id)hideOv(id)});
['shF','shD','shG'].forEach(id=>$(id).onclick=e=>{if(e.target===$(id))closeOv(id)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&ovs.length){closeOv(ovs[ovs.length-1]);return}
 if(ovs[ovs.length-1]==='lb'){if(e.key==='ArrowRight')lbGo(lb.i+1);else if(e.key==='ArrowLeft')lbGo(lb.i-1)}});
// teclado móvil: la barra inferior no sube con el teclado
const isTxt=el=>el&&el.matches&&el.matches('input[type=search],input[type=text],input[type=password]');
document.addEventListener('focusin',e=>{if(isTxt(e.target))document.body.classList.add('typing')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!isTxt(document.activeElement))document.body.classList.remove('typing')},50));

 <h3 style="margin-top:8px">${esc(p.name)}</h3><div class="fg">${esc(f.name)} · por ${esc(p.author)} · <a href="${esc(p.url)}" target="_blank" rel="noopener">GameBanana</a> · #${p.id}</div><div style="margin:8px 0">${stat(p,k)}</div><div class="dl">${d.join('')}</div>`;

/* ---------- Lightbox ---------- */
const lb={k:null,i:0,n:0,from:null};let zt=0,lbRaf=0;
function slides(p){const g=p.g||[];return g.length?g.map(f=>({o:gU(f,'o'),m:gU(f,'m'),s:gU(f,'s')})):p.img?[{o:p.img,m:p.img,s:p.img}]:[]}
function openLB(k,i,from){const e=idx[k];if(!e)return;const sl=slides(e.p);if(!sl.length){toast('Esta skin no tiene fotos');return}
 lb.k=k;lb.n=sl.length;lb.i=-1;lb.from=from||null;
 $('lbTrack').innerHTML=sl.map((s,j)=>`<div class="sl ld" data-j="${j}"><img alt="" data-s="${esc(s.o)}" data-m="${esc(s.m)}" draggable="false"></div>`).join('');
 $('lbTh').innerHTML=sl.length>1?sl.map((s,j)=>`<button data-j="${j}" aria-label="Foto ${j+1}"><img alt="" loading="lazy" src="${esc(s.s)}"></button>`).join(''):'';
 $('lbTh').hidden=sl.length<2;$('lbP').hidden=$('lbN').hidden=sl.length<2;
 $('lbGB').href=e.p.url;
 from?swapOv(from,'lb'):openOv('lb');
 const t=$('lbTrack');t.style.scrollBehavior='auto';t.scrollLeft=i*t.clientWidth;t.style.scrollBehavior='';
 lbIdx(i)}
function lbLoad(j){const s=document.querySelector(`#lbTrack .sl[data-j="${j}"]`);if(!s)return;const im=s.firstElementChild;if(im.getAttribute('src'))return;
 im.onload=()=>s.classList.remove('ld');im.onerror=()=>{if(im.src!==im.dataset.m)im.src=im.dataset.m;else s.classList.remove('ld')};im.src=im.dataset.s}
function lbIdx(i){i=Math.max(0,Math.min(lb.n-1,i));if(i===lb.i)return;
 const old=document.querySelector('#lbTrack .sl.z');if(old&&+old.dataset.j!==i)old.classList.remove('z');
 lb.i=i;[i-1,i,i+1,i+2].forEach(lbLoad);
 const e=idx[lb.k];$('lbT').textContent=e.p.name;$('lbS').textContent=`${i+1}/${lb.n} · ${e.f.name}`;
 document.querySelectorAll('#lbTh button').forEach((b,j)=>b.classList.toggle('on',j===i));
 const a=document.querySelector(`#lbTh button[data-j="${i}"]`);if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'});
 lbSync()}
function lbSync(){const e=idx[lb.k];if(!e)return;$('lbSave').textContent=sel[lb.k]?'♥ Guardada · quitar':`♡ Guardar (${used(e.f.code)}/${limit()})`;$('lbSave').className=sel[lb.k]?'p':''}
function lbGo(i){i=Math.max(0,Math.min(lb.n-1,i));const t=$('lbTrack');t.scrollTo({left:i*t.clientWidth,behavior:'smooth'})}
$('lbTrack').addEventListener('scroll',()=>{if(lbRaf)return;lbRaf=requestAnimationFrame(()=>{lbRaf=0;const t=$('lbTrack');lbIdx(Math.round(t.scrollLeft/Math.max(1,t.clientWidth)))})},{passive:true});
addEventListener('resize',()=>{if(ovs.includes('lb')){const t=$('lbTrack');t.style.scrollBehavior='auto';t.scrollLeft=lb.i*t.clientWidth;t.style.scrollBehavior=''}});
$('lbTrack').addEventListener('click',e=>{const s=e.target.closest('.sl');if(!s)return;const n=Date.now();
 if(n-zt<320){s.classList.toggle('z');if(s.classList.contains('z')){s.scrollLeft=(s.scrollWidth-s.clientWidth)/2;s.scrollTop=(s.scrollHeight-s.clientHeight)/2}zt=0}else zt=n});
$('lbTh').onclick=e=>{const b=e.target.closest('[data-j]');if(b)lbGo(+b.dataset.j)};
$('lbP').onclick=()=>lbGo(lb.i-1);$('lbN').onclick=()=>lbGo(lb.i+1);
const lbBack=()=>{if(lb.from){const k=lb.k;detail=k;swapOv('lb','shD')}else closeOv('lb')};
$('lbX').onclick=()=>{if(lb.from)lbBack();else closeOv('lb')};
$('lbSave').onclick=()=>toggle(lb.k);
$('lbDet').onclick=()=>{if(lb.from==='shD')lbBack();else openD(lb.k,true)};

/* ---------- Amigos: compartir y recibir ---------- */
const enc=ks=>ks.filter(k=>idx[k]).map(k=>{const i=k.indexOf(':');return encodeURIComponent(k.slice(0,i))+'.'+k.slice(i+1)}).join(',');
const linkOf=(t,ks)=>{const by=LS('ssbu_name');return location.origin+location.pathname+'#'+t+'='+enc(ks)+(by?'&by='+encodeURIComponent(by):'')};
async function sendLink(url,text){
 if(navigator.share){try{await navigator.share({title:'Skins SSBU',text,url});return}catch(e){if(e&&e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(url);toast('Enlace copiado: pégalo en WhatsApp o donde quieras')}catch(e){prompt('Copia este enlace:',url)}}
let gAction=null,gNoAct=null;
$('gOk').onclick=()=>gAction&&gAction();
$('gNo').onclick=()=>{gNoAct?gNoAct():closeOv('shG')};
function needName(cb){if(LS('ssbu_name'))return cb();
 $('gBody').innerHTML=`<h3>¿Cómo te llamas?</h3><p class="fg">Para que ${FM?esc(help.by):'tus amigos'} sepa de quién es el enlace.</p><input type="text" id="gname" placeholder="Tu nombre" autocomplete="off" style="width:100%;min-height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);padding:0 12px">`;
 $('gOk').hidden=false;$('gNo').hidden=false;$('gOk').textContent='Continuar';$('gNo').textContent='Cancelar';gNoAct=null;
 gAction=()=>{const v=$('gname').value.trim();if(!v){$('gname').focus();return}LS('ssbu_name',v);closeOv('shG');cb()};
 openOv('shG');setTimeout(()=>$('gname').focus(),150)}
function shareHelp(){needName(()=>sendLink(linkOf('help',Object.keys(sel)),'Ayúdame a elegir skins de Smash: abre el enlace, marca las que te gusten y mándame tu enlace de vuelta.'))}
function sendBack(){const ks=Object.keys(sel).filter(k=>idx[k]);if(!ks.length){toast('Marca primero alguna skin');return}
 needName(()=>sendLink(linkOf('sug',ks),`Mis recomendaciones para ti (${ks.length} skins).`))}
let incoming=null;
function readHash(){if(!HASH||HASH.type!=='sug'||FM)return;const ks=[...new Set(HASH.raw)].filter(k=>idx[k]);if(ks.length)incoming={by:HASH.by||'Un amigo',keys:ks}}
function showIncoming(){if(!incoming)return;const {by,keys}=incoming,nw=keys.filter(k=>!sel[k]);
 $('gBody').innerHTML=`<h3>${esc(by)} te recomienda ${keys.length} skin${keys.length==1?'':'s'}</h3><p class="fg">${nw.length?nw.length+' no están en tu selección. Se guardan como recomendaciones de '+esc(by)+' para que decidas.':'Todas ya están en tu selección.'}</p>${keys.slice(0,30).map(k=>{const {f,p}=idx[k];return `<div class="item" style="padding:6px 0"><div class="m"><b>${esc(p.name)}</b><span>${esc(f.name)}${sel[k]?' · ya la tienes':''}</span></div></div>`}).join('')}${keys.length>30?`<p class="fg">… y ${keys.length-30} más</p>`:''}`;
 $('gOk').hidden=!nw.length;$('gNo').hidden=false;$('gOk').textContent='Guardar recomendaciones';$('gNo').textContent=nw.length?'Descartar':'Cerrar';
 gAction=()=>{sugg.friends[incoming.by]=incoming.keys.filter(k=>!sel[k]);saveSug();incoming=null;closeOv('shG');renderGrid();tab('S');toast('Recomendaciones guardadas')};
 gNoAct=()=>{incoming=null;closeOv('shG')};openOv('shG')}
let welcomeOpen=false;
function showWelcome(){const n=help.raw.filter(k=>idx[k]).length;
 $('gBody').innerHTML=`<h3 id="wH">${esc(help.by)} te pidió ayuda</h3><p>Está eligiendo skins para Smash y quiere tu opinión.</p><div class="flow"><div><b>1</b><span>Explora y toca el marcador de las que te gusten${n?' ('+esc(help.by)+' ya tiene '+n+', marcadas con una etiqueta)':''}.</span></div><div><b>2</b><span>${help.room?''+esc(help.by)+' ve tus marcas al instante, no tienes que enviar nada.':'Cuando termines, toca <b style="font-weight:700">Enviar</b> arriba y mándale el enlace.'}</span></div></div>${help.room?`<input type="text" id="gname" placeholder="Tu nombre" value="${esc(LS('ssbu_name')||'')}" autocomplete="off" style="width:100%;min-height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);padding:0 12px;margin-top:12px">`:''}`;
 $('gOk').hidden=false;$('gOk').textContent='Empezar';$('gNo').hidden=true;welcomeOpen=true;
 gAction=()=>{if(help.room)LS('ssbu_name',(($('gname').value||'').trim())||'Amigo');welcomeOpen=false;closeOv('shG');$('gNo').hidden=false;publishVote(true)};gNoAct=null;openOv('shG')}

/* ---------- Firebase: salas en vivo (opcional; sin él la página funciona igual con enlaces) ---------- */
const FBCFG=META.firebase||null;
let _fb=null,liveState='off',liveFriends={},liveIds={},liveInit=false,unsubVotes=null,unsubRoom=null;
// SDK modular desde la CDN de Google, solo cuando hace falta (sala creada o unida)
function fb(){if(!FBCFG)return Promise.reject(new Error('Firebase no configurado'));
 return _fb||(_fb=(async()=>{const B='https://www.gstatic.com/firebasejs/10.14.1/';
  const [app,auth,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const a=app.initializeApp(FBCFG),au=auth.getAuth(a),db=fs.getFirestore(a);
  if(location.hostname==='localhost'&&/[?&]fbemu/.test(location.search)){auth.connectAuthEmulator(au,'http://localhost:9099',{disableWarnings:true});fs.connectFirestoreEmulator(db,'localhost',8080)}
  await new Promise(r=>{const u=auth.onAuthStateChanged(au,()=>{u();r()})});
  if(!au.currentUser)await auth.signInAnonymously(au);
  return {...fs,db,uid:au.currentUser.uid}})().catch(e=>{_fb=null;throw e}))}
function liveSet(st){if(liveState===st)return;liveState=st;if(FM)paintFm();if(view==='I')renderView()}
function liveErr(e){console.warn('Firebase:',e&&e.code||e);const first=liveState!=='err';liveSet('err');
 if(first)toast(e&&e.code==='permission-denied'?'Sala en vivo: sin permiso. ¿Publicaste las reglas de Firestore?':'Sin conexión en vivo: usa el enlace')}
const myKeys=()=>Object.keys(sel).filter(k=>idx[k]);
const newId=()=>{const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('')};
// dueño
async function createRoom(){try{const f=await fb(),id=newId();
  await f.setDoc(f.doc(f.db,'rooms',id),{ownerUid:f.uid,ownerName:LS('ssbu_name')||'Alguien',picks:myKeys(),createdAt:f.serverTimestamp(),updatedAt:f.serverTimestamp()});
  room={id};LS('ssbu_room',JSON.stringify(room));liveSet('ok');await watchVotes();renderView();return id}catch(e){liveErr(e);return null}}
function publishPicks(){if(FM||!room)return;clearTimeout(pubT);pubT=setTimeout(async()=>{if(!room)return;try{const f=await fb();
  await f.updateDoc(f.doc(f.db,'rooms',room.id),{picks:myKeys(),ownerName:LS('ssbu_name')||'Alguien',updatedAt:f.serverTimestamp()});liveSet('ok')}catch(e){liveErr(e)}},500)}
async function watchVotes(){if(unsubVotes||!room)return;const f=await fb();
 unsubVotes=f.onSnapshot(f.collection(f.db,'rooms',room.id,'votes'),snap=>{
  const m={},ids={};snap.forEach(d=>{const v=d.data()||{};let n=String(v.name||'Amigo').slice(0,40);if(m[n])n+=' ('+d.id.slice(0,3)+')';m[n]=(Array.isArray(v.picks)?v.picks:[]).filter(k=>idx[k]);ids[n]=d.id});
  if(liveInit)Object.entries(m).forEach(([n,ks])=>{const old=liveFriends[n];if(!old&&ks.length)toast(`${n} entró y recomendó ${ks.length}`);else if(old&&ks.length>old.length)toast(`${n} recomendó ${ks.length-old.length} más`)});
  liveFriends=m;liveIds=ids;liveInit=true;liveSet('ok');paintAll();if(view==='S'||view==='I')renderView()},e=>{unsubVotes=null;liveErr(e)})}
async function closeRoom(){if(!room||!confirm('¿Cerrar la sala? Tus amigos dejarán de verte y se borran sus recomendaciones en vivo.'))return;
 clearTimeout(pubT);
 try{const f=await fb();if(unsubVotes){unsubVotes();unsubVotes=null}
  await Promise.all(Object.values(liveIds).map(id=>f.deleteDoc(f.doc(f.db,'rooms',room.id,'votes',id))));
  await f.deleteDoc(f.doc(f.db,'rooms',room.id))}catch(e){liveErr(e)}
 room=null;LS('ssbu_room',null);liveFriends={};liveIds={};liveInit=false;liveSet('off');paintAll();renderView()}
function shareRoom(){if(!room)return;sendLink(location.origin+location.pathname+'#room='+room.id,'Entra a mi sala y ayúdame a elegir skins de Smash: marca las que te gusten y yo las veo al instante.')}
function roomBox(){const live=Object.entries(liveFriends),err=liveState==='err';
 if(!room)return `<div class="box" style="margin-top:12px"><h3>Sala en vivo</h3><p>Crea una sala y comparte el enlace: tus amigos ven lo que eliges y tú ves sus recomendaciones al instante. No necesitan cuenta.</p><div class="acts" style="padding:4px 0 0"><button class="p" id="rmNew">Crear sala en vivo</button></div></div>`;
 return `<div class="box" style="margin-top:12px"><h3>Sala en vivo <span class="live" style="color:${err?'var(--er)':'var(--ok)'}">${err?'● sin conexión':'● activa'}</span></h3><p>${live.length?live.length+' amigo'+(live.length==1?'':'s')+' en la sala:':'Comparte el enlace: aquí verás a tus amigos.'}</p>${live.map(([n,ks])=>`<div class="opt" style="min-height:44px"><span style="flex:1">${esc(n)} · ${ks.length} recomendada${ks.length==1?'':'s'}</span><button data-fdel="${esc(n)}" style="min-height:36px">Quitar</button></div>`).join('')}<div class="acts" style="padding:8px 0 0"><button class="p" id="rmShare">Compartir enlace</button><button id="rmClose">Cerrar sala</button></div></div>`}
// amigo
async function joinRoom(){if(!FM||!help.room||unsubRoom)return;
 try{const f=await fb();
  unsubRoom=f.onSnapshot(f.doc(f.db,'rooms',help.room),snap=>{
   if(!snap.exists()){liveSet('err');toast('La sala se cerró. Puedes enviar tus recomendaciones con el enlace.');return}
   const d=snap.data();help.by=d.ownerName||help.by;help.raw=Array.isArray(d.picks)?d.picks:[];LS('ssbu_help',JSON.stringify(help));
   if(welcomeOpen&&$('wH'))$('wH').textContent=help.by+' te pidió ayuda';
   liveSet('ok');paintAll();counts()},e=>{unsubRoom=null;liveErr(e)});
  publishVote(true)}catch(e){liveErr(e)}}
function publishVote(now){if(!FM||!help.room)return;clearTimeout(voteT);
 const go=async()=>{if(!FM||!help.room)return;try{const f=await fb();await f.setDoc(f.doc(f.db,'rooms',help.room,'votes',f.uid),{name:(LS('ssbu_name')||'Amigo').slice(0,40),picks:myKeys(),updatedAt:f.serverTimestamp()});liveSet('ok')}catch(e){liveErr(e)}};
 if(now)go();else voteT=setTimeout(go,500)}

/* ---------- Contrato selection.json ---------- */
function rankOf(k){const code=idx[k].f.code;const ks=Object.keys(sel).filter(x=>idx[x]&&idx[x].f.code===code).sort((a,b)=>(sel[a].slot==null)-(sel[b].slot==null)||(sel[a].slot||0)-(sel[b].slot||0));return ks.indexOf(k)+1}
function build(){const items=[];
 Object.keys(sel).forEach(k=>{const e=idx[k];if(!e)return;const {f,p}=e,r=remote.items[k];
  items.push({key:k,fighter:f.name,roster_no:f.code,mod_id:p.id,name:p.name,author:p.author,url:p.url,dest_slot:p.dest||null,assigned_slot:sel[k].slot!=null?slotName(sel[k].slot):null,order:rankOf(k),native_slots:p.slots_orig||null,assignment:p.assignment||null,audited:p.audited,wifi:p.wifi_status||'pendiente',dependencies:p.deps||null,conflicts:p.conflicts||null,notes:p.notes||null,
   status:(r&&r.status)||'wanted',selected_at:(r&&r.selected_at)||new Date(sel[k].t).toISOString(),...(r&&r.status&&r.status!=='wanted'?{result:r.result||null,updated_at:r.updated_at||null}:{})})});
 Object.keys(remote.items).forEach(k=>{const r=remote.items[k];if(!sel[k]&&r.status&&r.status!=='wanted')items.push(r)});
 return {schema:1,generated_at:new Date().toISOString(),catalog:META&&META.generated||null,target:{game:'Super Smash Bros. Ultimate',version:'13.0.5',loader:'ARCropolis 4.1.1',modpack_repo:'GianZapata/Gian-Ultimate-Modpack-private'},limits:{per_fighter:limit(),keep_original_slot:keepOrig},replace_slots:repl,items}}
function pending(){const g=(k,sl)=>k+'@'+(sl==null?'':sl);const a=Object.keys(sel).map(k=>g(k,sel[k].slot)).sort().join(),b=Object.keys(remote.items).filter(k=>(remote.items[k].status||'wanted')==='wanted').map(k=>g(k,slotNum(remote.items[k].assigned_slot))).sort().join();return a!==b}

/* ---------- GitHub ---------- */
const tok=()=>LS('ssbu_tok');
const gh=(u,o={})=>fetch('https://api.github.com/repos/'+REPO+u,{...o,headers:{Accept:'application/vnd.github+json',...(tok()?{Authorization:'Bearer '+tok()}:{}),...(o.headers||{})}});
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64e=s=>{let r='';new TextEncoder().encode(s).forEach(c=>r+=String.fromCharCode(c));return btoa(r)};
const applyRemote=j=>{remote.items={};(j.items||[]).forEach(e=>{remote.items[e.key]=e})};
async function pull(first){
 if(FM)return;
 try{let r;
  if(tok()){r=await gh('/contents/'+PATHF+'?ref='+BR);if(r.status===404){remote={items:{},sha:null};return}if(!r.ok)throw 0;const j=await r.json();remote.sha=j.sha;applyRemote(JSON.parse(b64d(j.content)))}
  else{r=await fetch(PATHF+'?'+Date.now());if(!r.ok)return;applyRemote(await r.json())}
  if(first&&!Object.keys(sel).length&&!dirty){Object.values(remote.items).forEach(e=>{if(idx[e.key]&&(e.status||'wanted')==='wanted')sel[e.key]={t:Date.parse(e.selected_at)||Date.now(),slot:slotNum(e.assigned_slot)}});saveSel()}
 }catch(e){}
 paintAll();if(view!=='E'&&!isTxt(document.activeElement))renderView()}
async function push(){
 if(!tok()){tab('I');toast('Primero pega tu token');return}
 const b=$('send');b.disabled=true;b.textContent='Enviando…';
 try{await pull();
  const body={message:`Selección de skins: ${Object.keys(sel).length} guardadas`,content:b64e(JSON.stringify(build(),null,2)+'\n'),branch:BR};if(remote.sha)body.sha=remote.sha;
  const r=await gh('/contents/'+PATHF,{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status===401||r.status===403?'el token no tiene permiso de escritura':r.status===409||r.status===422?'conflicto, reintenta':'GitHub '+r.status);
  const j=await r.json();remote.sha=j.content.sha;dirty=false;await pull();toast('Enviado ✓ Ya queda para instalar')
 }catch(e){toast('Error: '+e.message);renderView()}}
addEventListener('beforeunload',e=>{if(dirty&&tok()){e.preventDefault();e.returnValue=''}});
// un enlace de un amigo pegado en la misma pestaña solo cambia el #: reiniciar para procesarlo
addEventListener('hashchange',()=>{if(/^#(sel|help|sug|room)=/.test(location.hash))location.reload()});

if(FM){document.body.classList.add('fmode');$('tSl').textContent='Elegidas';$('tP').hidden=true}
ensureSlots();
fillFighters();readHash();renderGrid();counts();pull(true);
if(FM&&help.room)joinRoom();else if(room){watchVotes().catch(liveErr);publishPicks()}
if(incoming)setTimeout(showIncoming,300);else if(FM&&HASH&&(HASH.type==='help'||HASH.type==='room'))setTimeout(showWelcome,300);
</script></body></html>
