<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171a22">
<title>Skins SSBU · selección personal</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101218;
  --bar: #171a22;
  --card: #1c202a;
  --card-sel: #14241c;
  --line: #2e3442;
  --text: #e8ebf2;
  --muted: #aeb6c7;
  --accent: #8eb4ff;
  --chip: #222733;
  --field: #12151c;
  --field-line: #3c4456;
  --pick: #146c38;
  --pick-ink: #f4fff8;
  --danger: #f0b4b4;
  --warn-bg: #2a2418;
  --warn-line: #6e5a30;
  --warn-ink: #f3e6c8;
  --header-h: 148px;
  font-family: system-ui, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 8px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .38; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a { color: var(--accent); text-underline-offset: 2px; }
.skip {
  position: absolute; left: 12px; top: -48px; z-index: 20;
  background: #f4f7ff; color: #111; padding: 8px 12px; border-radius: 8px;
}
.skip:focus { top: 8px; }
.vh {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
header {
  position: sticky; top: 0; z-index: 5;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  padding: 10px 12px 12px;
  padding-top: max(10px, env(safe-area-inset-top));
  display: grid; gap: 8px;
}
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
h1 { margin: 0; font-size: 1.0625rem; line-height: 1.2; letter-spacing: -.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: .8125rem; }
#cnt { margin: 0; padding-top: 1px; font-size: .9375rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
input[type="search"], select {
  width: 100%; min-width: 0; max-width: 100%;
  min-height: 44px;
  background: var(--field);
  border: 1px solid var(--field-line);
  border-radius: 10px;
  padding: 0 12px;
  font-size: 16px;
}
input::placeholder { color: #9aa3b5; opacity: 1; }
.stepper { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px; gap: 8px; }
.stepper button, .chip, .btn, .choose, .empty button {
  min-height: 44px;
  border-radius: 10px;
  border: 1px solid var(--field-line);
  background: var(--chip);
  font-size: 16px;
}
.stepper button { padding: 0; font-size: 1.35rem; line-height: 1; }
.stepper button:active:not(:disabled), .chip:active, .btn:active:not(:disabled) { background: #32384a; }
.layout { display: block; }
nav { display: none; }
main { padding: 12px 12px 8px; min-width: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 8px; }
#wf { flex: 1 1 100%; }
.chip, .btn { padding: 0 14px; }
.chip { flex: 1 1 calc(50% - 8px); max-width: calc(50% - 4px); }
.actions { display: flex; gap: 8px; flex: 1 1 100%; }
.actions .btn { flex: 1 1 0; }
header > *, .stepper label { min-width: 0; }
.stepper label { display: block; }
.chip[aria-pressed="true"] { background: #243352; border-color: #6f96e0; color: #e7efff; }
.spacer { display: none; }
#clr { color: var(--danger); background: transparent; }
.note { margin: 0 0 8px; color: var(--muted); font-size: .8125rem; }
.fhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 8px; }
.fhead h2 { margin: 0; font-size: 1.375rem; line-height: 1.2; letter-spacing: -.02em; }
.meta { margin: 0; color: var(--muted); font-size: .8125rem; }
.warn {
  background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink);
  padding: 10px 12px; border-radius: 10px; font-size: .8125rem; margin: 0 0 12px;
}
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; min-width: 0; height: 100%;
  box-shadow: inset 0 0 0 1px transparent;
}
.card.sel { background: var(--card-sel); border-color: #2d8a4e; box-shadow: inset 0 0 0 1px #2d8a4e; }
.ph { position: relative; background: #0c0e13; }
.ph img, .noimg { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.noimg { display: grid; place-items: center; color: var(--muted); font-size: .875rem; }
.mark {
  position: absolute; top: 8px; left: 8px;
  background: var(--pick); color: var(--pick-ink);
  font-size: .75rem; font-weight: 700; line-height: 1.2;
  padding: 4px 8px; border-radius: 999px;
}
.b, .more, .q, .slot, .extra { overflow-wrap: break-word; }
.copy { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.b { order: 1; padding: 12px 12px 0; display: grid; gap: 6px; align-content: start; }
.after { order: 3; padding: 0 12px 4px; display: grid; gap: 6px; }
.ft { order: 2; }
.t { margin: 0; font-size: 1rem; font-weight: 650; line-height: 1.3; }
.by, .q, .slot, .extra, .more { font-size: .8125rem; }
.by, .slot { margin: 0; color: var(--muted); }
.by a { text-decoration: underline; }
.id { font-variant-numeric: tabular-nums; }
.q { margin: 0; color: #d5dbe6; }
.extra { margin: 0; color: #d5dbe6; }
.slot.hot { color: #f3c7a2; }
.state { margin: 0; font-size: .8125rem; font-weight: 650; line-height: 1.35; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  display: inline-block; padding: 3px 8px; border-radius: 999px;
  background: #262b38; color: #d5dbe8; font-size: .75rem; font-weight: 650; line-height: 1.35;
}
.w1 { color: #9be7b8; } .w2 { color: #f3d48a; } .w3 { color: #f3b98a; }
.w4 { color: #d5dbe8; } .w5 { color: #f3b0b0; } .w0 { color: #c9ccf6; }
.ft { padding: 10px 12px 12px; }
.choose { width: 100%; background: transparent; border-color: #6f96e0; color: #e7efff; font-weight: 650; }
.card.sel .choose { background: var(--pick); border-color: var(--pick); color: var(--pick-ink); }
details { border-top: 1px solid var(--line); }
summary {
  min-height: 44px; display: flex; align-items: center; gap: 8px;
  padding: 0 12px; cursor: pointer; color: var(--accent); font-size: .9375rem;
  list-style: none;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; color: var(--muted); }
details[open] summary::before { content: "▾"; }
.more { padding: 0 12px 12px; display: grid; gap: 6px; color: #d5dbe6; }
.empty { padding: 8px 0 20px; }
.empty h2 { margin: 0 0 8px; font-size: 1.15rem; }
.empty p { margin: 0 0 12px; color: var(--muted); }
footer {
  padding: 4px 12px 28px;
  padding-bottom: max(28px, env(safe-area-inset-bottom));
  color: var(--muted); font-size: .75rem;
}
@media (hover: hover) {
  .card:hover { border-color: #46506a; }
  .card.sel:hover { border-color: #3caf68; }
  .choose:hover { background: #243352; }
  .card.sel .choose:hover { background: #115c30; }
  .chip:hover, .btn:hover, .stepper button:hover:not(:disabled) { background: #2a3142; }
  #clr:hover { background: #2a2226; }
}
@media (min-width: 700px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .after { order: 2; }
  .ft { order: 3; margin-top: auto; }
}
@media (min-width: 800px) {
  #wf { flex: 1 1 220px; max-width: 320px; }
  .chip { flex: 0 0 auto; max-width: none; }
  .actions { flex: 0 0 auto; }
  .actions .btn { flex: 0 0 auto; }
  .spacer { display: block; flex: 1 1 8px; min-width: 8px; }
}
@media (min-width: 960px) {
  header {
    grid-template-columns: max-content minmax(200px, 280px) minmax(340px, 1fr);
    align-items: center;
    column-gap: 16px;
    padding-inline: 20px;
  }
  .top { width: max-content; align-items: flex-start; justify-content: flex-start; gap: 16px; }
  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
  nav {
    display: block; position: sticky; top: var(--header-h);
    height: calc(100vh - var(--header-h)); height: calc(100dvh - var(--header-h));
    overflow: auto; overscroll-behavior: contain;
    border-right: 1px solid var(--line); padding: 8px;
  }
  nav button {
    width: 100%; min-height: 44px; margin: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    text-align: left; padding: 8px 10px; border: 0; border-radius: 8px;
    background: transparent; color: #d5dbe8; font-size: .875rem;
  }
  nav button.on { background: #2a3550; color: #fff; }
  nav .nm { flex: 1; min-width: 0; }
  nav .c { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .75rem; white-space: nowrap; }
  nav button.on .c { color: #d5deef; }
  main { padding: 16px 20px 8px; }
  footer { padding-inline: 20px; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header>
  <div class="top">
    <div class="brand">
      <h1>Skins SSBU</h1>
      <p class="sub">13.0.5 · ARCropolis 4.1.1</p>
    </div>
    <p id="cnt" aria-live="polite">0 elegidas</p>
  </div>
  <label class="search">
    <span class="vh">Buscar luchador</span>
    <input id="fq" type="search" placeholder="Buscar luchador" autocomplete="off" autocapitalize="off" enterkeyhint="search">
  </label>
  <div class="stepper">
    <button type="button" id="prev" aria-label="Luchador anterior" title="Luchador anterior">‹</button>
    <label>
      <span class="vh">Luchador</span>
      <select id="fighter" aria-controls="stage"></select>
    </label>
    <button type="button" id="next" aria-label="Luchador siguiente" title="Luchador siguiente">›</button>
  </div>
</header>
<div class="layout">
  <nav id="nav" aria-label="Luchadores"></nav>
  <main id="main">
    <div class="tools" id="tools">
      <select id="wf" aria-label="Estado Wi-Fi"><option value="">Todos los estados Wi-Fi</option></select>
      <button type="button" class="chip" id="onlyA" aria-pressed="false" title="Mostrar solo skins ya auditadas">Auditadas</button>
      <button type="button" class="chip" id="onlyS" aria-pressed="false" title="Mostrar solo las que marqué">Mis elegidas</button>
      <button type="button" class="chip" id="showW" aria-pressed="false" title="Incluir skins retiradas del catálogo">Retiradas</button>
      <span class="spacer"></span>
      <div class="actions">
        <button type="button" class="btn" id="exp" title="Descargar mi selección en JSON">Exportar</button>
        <button type="button" class="btn" id="clr" title="Borrar toda mi selección">Limpiar</button>
      </div>
    </div>
    <p class="note">Los estados Wi-Fi son evidencia del catálogo, no una prueba en consola.</p>
    <div id="stage"></div>
  </main>
</div>
<footer>Página {{STAMP}} · auditoría <span id="gen"></span></footer>
<noscript><p class="note">Esta página necesita JavaScript para elegir skins.</p></noscript>
<script>
const F=/*DATA*/null;const META=/*META*/null;
const WS={
  autor_explicito:['w1','Autor: declaración explícita sin condiciones','Autor, sin condiciones'],
  autor_condicionado:['w2','Autor: declaración condicionada','Autor, con condiciones'],
  tercero:['w3','Solo terceros, sin confirmación del autor','Solo terceros'],
  sin_evidencia:['w4','Sin evidencia localizada','Sin evidencia'],
  incompatible:['w5','Incompatible según la fuente','Incompatible']
};
const KEY='ssbu_sel_v1';
const wf=document.getElementById('wf');
const fq=document.getElementById('fq');
const fighter=document.getElementById('fighter');
const stage=document.getElementById('stage');
const navEl=document.getElementById('nav');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
let sel={}; try{ sel=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ sel={}; }
let cur=0, booted=false;
Object.entries(WS).forEach(([k,v])=>wf.add(new Option(v[2],k)));
wf.add(new Option('Pendiente de auditoría','_pend'));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k=(f,p)=>f.code+':'+p.id;
const pressed=id=>document.getElementById(id).getAttribute('aria-pressed')==='true';
const norm=s=>String(s??'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(sel)); }catch(e){} }
function picksOf(f){
  const fw=wf.value, oa=pressed('onlyA'), os=pressed('onlyS'), sw=pressed('showW');
  return f.picks.filter(p=>{
    if(p.withdrawn && !sw) return false;
    if(oa && !p.audited) return false;
    if(os && !sel[k(f,p)]) return false;
    if(fw==='_pend') return !p.audited;
    if(fw) return p.wifi_status===fw;
    return true;
  });
}
function visibleIdx(){
  const q=norm(fq.value.trim()), narrow=!!(wf.value||pressed('onlyA')||pressed('onlyS'));
  const out=[];
  F.forEach((f,i)=>{
    if(q && !norm(f.code+' '+f.name).includes(q)) return;
    if((q||narrow) && !picksOf(f).length) return;
    out.push(i);
  });
  return out;
}
function label(f){
  const a=f.picks.filter(p=>p.audited).length, s=f.picks.filter(p=>sel[k(f,p)]).length;
  let t=f.code+' '+f.name;
  if(a<f.picks.length) t+=' · '+a+'/'+f.picks.length;
  if(s) t+=' · ✓'+s;
  return t;
}
function noun(n,one,many){ return n+' '+(n===1?one:many); }
function row(label,value){ return value?`<div><b>${label}.</b> ${esc(value)}</div>`:''; }
function slotFace(p){
  const bits=[];
  if(p.dest) bits.push('Destino '+p.dest);
  if(p.assignment) bits.push(p.assignment);
  else if(!p.dest && p.slots_orig) bits.push('Slot de origen '+p.slots_orig);
  return bits.join(' · ');
}
function tags(p){
  let state;
  if(p.audited){ const x=WS[p.wifi_status]||['w0',p.wifi_status||'Estado sin clasificar']; state=`<p class="state ${x[0]}">${esc(x[1])}</p>`; }
  else state='<p class="state w0">Pendiente de auditoría</p>';
  const bits=[];
  if(p.new) bits.push('<span class="tag w1">Sustituta</span>');
  if(p.withdrawn) bits.push('<span class="tag w5">Retirada</span>');
  return state+(bits.length?`<div class="tags">${bits.join('')}</div>`:'');
}
function evidence(p){
  const bits=[];
  if(p.audited){
    if(p.wifi_source||p.wifi_source_url){
      const src=p.wifi_source?esc(p.wifi_source):'';
      const link=p.wifi_source_url?`<a href="${esc(p.wifi_source_url)}" target="_blank" rel="noopener noreferrer">fuente</a>`:'';
      bits.push(`<div><b>Fuente.</b> ${[src,link].filter(Boolean).join(' · ')}</div>`);
    }
    bits.push(row('Condiciones',p.conditions));
    bits.push(row('Diseño',p.design));
    bits.push(row('Slots',`origen ${p.slots_orig||'?'} → ${p.dest||'?'}${p.assignment?' ('+p.assignment+')':''}`));
    bits.push(row('Conflictos',p.conflicts));
    bits.push(row('Dependencias',p.deps));
    bits.push(`<div><b>Compatibilidad.</b> ${esc(p.compat||'no verificada')} · ${esc(p.file_note||'archivo no inspeccionado')} · ${esc(p.console_test||'prueba en consola pendiente')}</div>`);
    bits.push(row('Estado',p.status));
    bits.push(row('Notas',p.notes));
  } else {
    if(p.quote_prev) bits.push(row('Cita previa, sin verificar',p.quote_prev));
    bits.push(`<div>Slots de origen: ${esc(p.slots_orig||'no indicados')}. Archivo no inspeccionado. Prueba en consola pendiente.</div>`);
    if(p.note_prev) bits.push(row('Notas',p.note_prev));
  }
  return bits.filter(Boolean).join('');
}
function card(f,p){
  const on=!!sel[k(f,p)];
  const face=slotFace(p);
  const hot=/choca/i.test(p.assignment||'');
  const img=p.img?`<img alt="${esc(p.name)}" loading="lazy" src="${esc(p.img)}">`:`<div class="noimg">Sin vista previa</div>`;
  const deps=p.deps?`<p class="extra"><b>Dependencias.</b> ${esc(p.deps)}</p>`:'';
  const conf=p.conflicts?`<p class="extra"><b>Conflictos.</b> ${esc(p.conflicts)}</p>`:'';
  const quote=p.audited&&p.wifi_quote?`<p class="q">«${esc(p.wifi_quote)}»</p>`:'';
  const extra=[quote,deps,conf].filter(Boolean).join('');
  return `<article class="card${on?' sel':''}">
    <div class="ph">${img}${on?'<span class="mark">Elegida</span>':''}</div>
    <div class="copy">
      <div class="b">
        <h3 class="t">${esc(p.name)}</h3>
        <p class="by">por ${esc(p.author)} · <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">GameBanana</a> <span class="id">#${esc(p.id)}</span></p>
        ${tags(p)}
        ${face?`<p class="slot${hot?' hot':''}">${esc(face)}</p>`:''}
      </div>
      <div class="ft"><button type="button" class="choose" data-k="${esc(k(f,p))}" aria-pressed="${on?'true':'false'}" aria-label="${on?'Quitar de mi selección: ':'Elegir: '}${esc(p.name)}">${on?'Elegida':'La quiero'}</button></div>
      ${extra?`<div class="after">${extra}</div>`:''}
    </div>
    <details><summary>Evidencia y notas</summary><div class="more">${evidence(p)}</div></details>
  </article>`;
}
function syncHeader(){
  const h=document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--header-h', h+'px');
}
function scrollToStage(){
  const y=stage.getBoundingClientRect().top+window.scrollY-document.querySelector('header').offsetHeight-8;
  window.scrollTo(0, Math.max(0,y));
}
function render(opts={}){
  const before=cur;
  const idx=visibleIdx();
  if(!idx.length) cur=-1;
  else if(!idx.includes(cur)) cur=idx[0];
  const changed=cur!==before;
  fighter.innerHTML=idx.map(i=>`<option value="${i}"${i===cur?' selected':''}>${esc(label(F[i]))}</option>`).join('')
    || '<option value="">Ningún luchador</option>';
  const pos=idx.indexOf(cur);
  prev.disabled=pos<=0; next.disabled=pos<0||pos>=idx.length-1;
  const nSel=Object.keys(sel).length;
  document.getElementById('cnt').textContent=noun(nSel,'elegida','elegidas');
  navEl.innerHTML=idx.map(i=>{
    const f=F[i], on=i===cur;
    const s=f.picks.filter(p=>sel[k(f,p)]).length;
    const a=f.picks.filter(p=>p.audited).length;
    const meta=(s?'✓'+s+' · ':'')+a+'/'+f.picks.length;
    return `<button type="button" data-i="${i}" class="${on?'on':''}"${on?' aria-current="true"':''}><span class="nm">${esc(f.name)}</span><span class="c">${meta}</span></button>`;
  }).join('');
  navEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{ cur=+b.dataset.i; render(); });
  const onBtn=navEl.querySelector('button.on');
  if(onBtn && navEl.offsetParent){
    const top=onBtn.offsetTop, bottom=top+onBtn.offsetHeight;
    if(top<navEl.scrollTop) navEl.scrollTop=top;
    else if(bottom>navEl.scrollTop+navEl.clientHeight) navEl.scrollTop=bottom-navEl.clientHeight;
  }
  if(cur<0){
    stage.innerHTML='<div class="empty"><h2>Sin resultados</h2><p>Ningún luchador coincide con la búsqueda o los filtros.</p><button type="button" id="resetF">Quitar búsqueda y filtros</button></div>';
    document.getElementById('resetF').onclick=()=>{
      fq.value=''; wf.value='';
      ['onlyA','onlyS','showW'].forEach(id=>document.getElementById(id).setAttribute('aria-pressed','false'));
      cur=0; render();
    };
  } else {
    const f=F[cur], ps=picksOf(f);
    const audited=f.picks.filter(p=>p.audited).length;
    const mine=f.picks.filter(p=>sel[k(f,p)]).length;
    const pending=f.picks.length-audited;
    const shown=ps.length===f.picks.length?noun(f.picks.length,'candidata','candidatas'):'Mostrando '+ps.length+' de '+f.picks.length;
    const warn=pending?(pending===1
      ?'1 candidata de este luchador sigue pendiente de auditoría. Su Wi-Fi y sus slots no están comprobados.'
      :`${pending} de ${f.picks.length} candidatas de este luchador siguen pendientes de auditoría. Su Wi-Fi y sus slots no están comprobados.`):'';
    stage.innerHTML=`<div class="fhead"><h2 id="fname">${esc(f.name)}</h2><p class="meta">${shown} · ${noun(audited,'auditada','auditadas')} · ${noun(mine,'elegida','elegidas')}${f.dlc?' <span class="tag">DLC</span>':''}</p></div>${warn?`<p class="warn">${warn}</p>`:''}<div class="grid">${ps.map(p=>card(f,p)).join('')||'<p class="empty">Nada con estos filtros.</p>'}</div>`;
    stage.querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>{
      const y=window.scrollY, id=c.dataset.k;
      if(c.getAttribute('aria-pressed')==='true') delete sel[id]; else sel[id]=1;
      save();
      const moved=render({keep:true,focus:id}).changed;
      if(!moved) window.scrollTo(0,y);
    });
    stage.querySelectorAll('.ph img').forEach(img=>{ img.onerror=()=>{ const d=document.createElement('div'); d.className='noimg'; d.textContent='Sin vista previa'; img.replaceWith(d); }; });
  }
  if(opts.focus){ const btn=stage.querySelector('[data-k="'+CSS.escape(opts.focus)+'"]'); if(btn) btn.focus({preventScroll:true}); }
  const moved=booted && (!opts.keep || changed);
  if(moved) scrollToStage();
  booted=true; syncHeader();
  return {changed:!!changed};
}
document.getElementById('prev').onclick=()=>{ const idx=visibleIdx(), p=idx.indexOf(cur); if(p>0){ cur=idx[p-1]; render(); } };
document.getElementById('next').onclick=()=>{ const idx=visibleIdx(), p=idx.indexOf(cur); if(p>=0 && p<idx.length-1){ cur=idx[p+1]; render(); } };
fighter.onchange=()=>{ if(fighter.value!==''){ cur=+fighter.value; render(); } };
fq.oninput=()=>render({keep:true});
[wf].forEach(e=>e.onchange=()=>render({keep:true}));
['onlyA','onlyS','showW'].forEach(id=>{
  document.getElementById(id).onclick=()=>{
    const el=document.getElementById(id);
    el.setAttribute('aria-pressed', pressed(id)?'false':'true');
    render({keep:true});
  };
});
document.getElementById('clr').onclick=()=>{ if(confirm('¿Borrar toda tu selección?')){ sel={}; save(); render({keep:true}); } };
document.getElementById('exp').onclick=()=>{
  const out=[];
  F.forEach(f=>f.picks.forEach(p=>{ if(sel[k(f,p)]) out.push({luchador:f.name,id:p.id,nombre:p.name,autor:p.author,url:p.url,auditada:p.audited,wifi:p.wifi_status||'pendiente',destino:p.dest||null}); }));
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='mi_seleccion_ssbu.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};
document.getElementById('gen').textContent=(META&&META.generated||'').replace('T',' ');
window.addEventListener('resize', syncHeader);
if(!Array.isArray(F)) stage.innerHTML='<p class="empty">No hay catálogo cargado.</p>';
else render();
</script>
</body>
